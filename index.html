<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="خوي Bin3abdAi">
<meta name="theme-color" content="#0b1220">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="icon" href="icon-512.png">
<title>خوي Bin3abdAi</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --fs:1.1;
  --bg:#0b1220; --bg2:#0f1a30; --card:rgba(255,255,255,.06); --card2:rgba(255,255,255,.10);
  --line:rgba(148,197,255,.18); --ink:#f1f5f9; --muted:#9fb0c8;
  --accent:#22d3ee; --accent2:#6366f1; --accentRGB:34,211,238;
  --ok:#22c55e; --danger:#ef4444; --shadow:0 10px 30px rgba(0,0,0,.35);
}
html[data-theme="light"]{
  --bg:#eef3f9; --bg2:#ffffff; --card:#ffffff; --card2:#f1f5fb;
  --line:#d3dde9; --ink:#0f172a; --muted:#475569;
  --accent:#0e7490; --accent2:#4f46e5; --accentRGB:14,116,144;
  --shadow:0 8px 22px rgba(15,23,42,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'Tajawal',system-ui,sans-serif;font-size:calc(21px * var(--fs));line-height:1.6}
body{background:radial-gradient(1200px 600px at 100% -10%,rgba(var(--accentRGB),.16),transparent 60%),radial-gradient(900px 500px at -10% 10%,rgba(99,102,241,.14),transparent 60%),var(--bg);background-attachment:fixed;padding:calc(env(safe-area-inset-top) + 6px) 14px calc(env(safe-area-inset-bottom) + 24px)}
button{font-family:inherit;font-size:1em;cursor:pointer;border:0;color:inherit}
input,textarea,select{font-family:inherit;font-size:.92em;width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--card2);color:var(--ink);outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(var(--accentRGB),.25)}
label{display:block;font-weight:700;margin:16px 0 6px}
a{color:var(--accent)}
.screen{display:none;padding-bottom:30px;animation:fade .25s ease}
.screen.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.top{display:flex;align-items:center;gap:12px;margin:6px 0 16px;position:sticky;top:0;z-index:5;padding:8px 0;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.back{background:var(--card2);border:1.5px solid var(--line);border-radius:16px;padding:11px 18px;font-weight:800}
.title{font-size:1.35em;font-weight:800;margin:0}
.glass{background:var(--card);border:1.5px solid var(--line);border-radius:22px;box-shadow:var(--shadow);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.info{padding:14px 16px;margin:12px 0;font-weight:700}
.small{font-size:.82em;color:var(--muted);font-weight:500}
.hint{color:var(--muted);font-size:.9em;text-align:center;margin:10px 0}
.row{display:flex;gap:10px}.row>*{flex:1}
.brandbar{display:flex;align-items:center;justify-content:space-between;margin:4px 0 10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800}
.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-size:1.2em;box-shadow:0 0 22px rgba(var(--accentRGB),.45)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:var(--card2);border:1.5px solid var(--line);font-weight:700;font-size:.85em}
.hello{font-size:1.45em;font-weight:800;margin:6px 0 0}
.clock{font-size:2.5em;font-weight:800;line-height:1.1;margin:2px 0;letter-spacing:.5px}
.date{color:var(--muted)}
.hero{display:flex;align-items:center;gap:16px;padding:18px;margin:14px 0;border-radius:26px;background:linear-gradient(135deg,rgba(var(--accentRGB),.22),rgba(99,102,241,.25));border:1.5px solid rgba(var(--accentRGB),.45);width:100%;text-align:start;box-shadow:0 0 30px rgba(var(--accentRGB),.18)}
.hero .orbmini{width:74px;height:74px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 30%,#fff,rgba(var(--accentRGB),.9) 30%,var(--accent2) 70%,transparent 72%);box-shadow:0 0 30px rgba(var(--accentRGB),.6);animation:breathe 3s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.06);box-shadow:0 0 45px rgba(var(--accentRGB),.85)}}
.hero b{font-size:1.25em;display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border-radius:22px;min-height:132px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:800;font-size:1.02em;color:#fff;box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.18);position:relative;overflow:hidden;text-align:center;padding:10px}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.18),transparent 45%)}
.tile .ic{font-size:2.3em;line-height:1}
.tile:active,.big:active,.mic:active,.hero:active{transform:scale(.97)}
.g1{background:linear-gradient(135deg,#2563eb,#1e3a8a)}.g2{background:linear-gradient(135deg,#7c3aed,#4c1d95)}
.g3{background:linear-gradient(135deg,#0d9488,#115e59)}.g4{background:linear-gradient(135deg,#059669,#065f46)}
.g5{background:linear-gradient(135deg,#dc2626,#7f1d1d)}.g6{background:linear-gradient(135deg,#0891b2,#164e63)}
.g7{background:linear-gradient(135deg,#16a34a,#14532d)}.g8{background:linear-gradient(135deg,#9333ea,#581c87)}
.g9{background:linear-gradient(135deg,#e11d48,#881337)}.g10{background:linear-gradient(135deg,#475569,#1e293b)}
.big{width:100%;border-radius:18px;padding:17px;font-weight:800;font-size:1.08em;color:#fff;margin:8px 0;box-shadow:var(--shadow);background:linear-gradient(135deg,var(--accent),var(--accent2))}
.big.alt{background:var(--card2);color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.big.red{background:linear-gradient(135deg,#ef4444,#991b1b)}
.big.green{background:linear-gradient(135deg,#22c55e,#166534)}
.mic{width:100%;min-height:150px;border-radius:26px;color:#fff;font-size:1.25em;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:16px;box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.2)}
.mic .ic{font-size:2.6em;line-height:1}
.mic.rec{background:linear-gradient(135deg,#ef4444,#991b1b)!important;animation:pulse 1.2s infinite}
.mic.busy{background:linear-gradient(135deg,#64748b,#334155)!important}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(239,68,68,.6)}100%{box-shadow:0 0 0 22px rgba(239,68,68,0)}}
.bubble{padding:14px 16px;margin:12px 0;font-size:1.05em;white-space:pre-wrap;border-radius:20px;border:1.5px solid var(--line);background:var(--card)}
.bubble.me{border-color:rgba(34,197,94,.45)}
.bubble.ai{border-color:rgba(var(--accentRGB),.5)}
.pill{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:13px 14px;font-weight:800;margin:6px 0;text-align:start;width:100%}
.pill.sel{border-color:var(--accent);background:rgba(var(--accentRGB),.16);box-shadow:0 0 0 2px rgba(var(--accentRGB),.25)}
.pt{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;margin:10px 0;font-size:1.2em;font-weight:800}
.pt.next{border-color:var(--accent);background:rgba(var(--accentRGB),.14)}
.med{padding:14px 16px;margin:12px 0}
.med.done{border-color:rgba(34,197,94,.6)}
.med .n{font-size:1.2em;font-weight:800}
.dhikr{padding:20px;font-size:1.3em;line-height:2;margin:12px 0;text-align:center}
.count{font-size:2.1em;font-weight:800;text-align:center}
.qbar{position:sticky;bottom:8px;border-radius:22px;padding:12px;margin-top:14px;text-align:center;background:linear-gradient(135deg,#0d9488,#1e3a8a);color:#fff;box-shadow:var(--shadow)}
.qbar .nm{font-size:1.25em;font-weight:800}
.qbar .row button{background:rgba(255,255,255,.95);color:#0f172a;border-radius:14px;padding:13px;font-size:1.35em;font-weight:800}
.overlay{position:fixed;inset:0;background:rgba(2,6,23,.82);display:none;align-items:center;justify-content:center;z-index:50;padding:18px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.overlay.on{display:flex}
.modal{background:var(--bg2);border:1.5px solid var(--line);border-radius:26px;padding:24px;width:100%;max-width:520px;text-align:center;box-shadow:var(--shadow)}
.modal .ic{font-size:3.6em}
.modal .msg{font-size:1.4em;font-weight:800;margin:8px 0 16px}
.show{position:fixed;inset:0;background:#fff;color:#000;z-index:60;display:none;flex-direction:column;justify-content:center;padding:24px;text-align:center}
.show.on{display:flex}
.show .t{font-size:2.2em;font-weight:800;line-height:1.5}
.show .s{font-size:1.05em;color:#555;margin-top:18px}
.foot{text-align:center;margin:28px 0 6px}
.foot .sig{font-weight:800;font-size:1.05em;letter-spacing:.5px;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.foot .tag{font-size:.75em;color:var(--muted);letter-spacing:2px;margin-top:2px}
.foot .links{display:flex;gap:10px;justify-content:center;margin-top:12px}
.foot .links button{background:var(--card2);border:1.5px solid var(--line);border-radius:999px;padding:9px 16px;font-weight:700;font-size:.85em}
.medrow,.famrow{border:1.5px dashed var(--line);border-radius:14px;padding:10px;margin:10px 0}
.err{background:rgba(239,68,68,.12);border:1.5px solid rgba(239,68,68,.6);border-radius:16px;padding:12px;margin:10px 0;font-weight:700}
/* picker */
.pk{position:fixed;inset:0;z-index:55;background:var(--bg);display:none;flex-direction:column;padding:calc(env(safe-area-inset-top) + 10px) 14px 14px}
.pk.on{display:flex}
.pk .list{overflow:auto;flex:1;margin-top:10px}
.pkItem{display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;margin:7px 0;font-weight:800}
.pkItem .fl{font-size:1.6em}
.pkMic{width:100%;border-radius:16px;padding:14px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));margin-top:8px;display:flex;align-items:center;justify-content:center;gap:8px}
.pkMic .ic{font-size:1.3em}
.pkMic.rec{background:linear-gradient(135deg,#ef4444,#991b1b);animation:pulse 1.2s infinite}
.pkMic.busy{background:#475569}
/* assistant */
#asst{padding-bottom:10px}
.orbwrap{position:relative;height:min(58vw,300px);margin:4px auto 0;display:grid;place-items:center}
#orb{width:100%;height:100%}
.astate{text-align:center;font-weight:800;color:var(--accent);letter-spacing:1px;min-height:1.6em}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.chips button{background:var(--card2);border:1.5px solid var(--line);border-radius:999px;padding:10px 14px;font-weight:700;font-size:.85em}
.boot{position:fixed;inset:0;z-index:70;background:#030712;color:#a5f3fc;display:none;flex-direction:column;align-items:center;justify-content:center;font-family:ui-monospace,Menlo,monospace;gap:10px}
.boot.on{display:flex}
.boot .ring{width:120px;height:120px;border-radius:50%;border:3px solid rgba(34,211,238,.2);border-top-color:#22d3ee;animation:spin 1s linear infinite;box-shadow:0 0 40px rgba(34,211,238,.35)}
@keyframes spin{to{transform:rotate(360deg)}}
.boot .lines{min-height:5em;text-align:center;font-size:.85em;line-height:1.7}
.boot .bar{width:220px;height:6px;border-radius:9px;background:rgba(34,211,238,.15);overflow:hidden}
.boot .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#22d3ee,#6366f1);transition:width .25s}
/* onboarding */
.onb{position:fixed;inset:0;z-index:65;background:var(--bg);display:none;flex-direction:column;justify-content:center;padding:24px 18px}
.onb.on{display:flex}
.onb h1{font-size:1.7em;margin:.2em 0}
.dots{display:flex;gap:6px;justify-content:center;margin-bottom:18px}
.dots i{width:9px;height:9px;border-radius:9px;background:var(--line)}.dots i.on{width:26px;background:var(--accent)}
.tr-l{direction:ltr;text-align:left}
.res{font-size:2.2em;font-weight:800;text-align:center;margin:8px 0;word-break:break-word}
</style>
</head>
<body>

<!-- ===================== HOME ===================== -->
<section id="home" class="screen on">
  <div class="brandbar">
    <div class="brand"><div class="logo">🤝</div><div>خوي <span dir="ltr">Bin3abdAi</span></div></div>
    <button class="chip" id="destChip" onclick="pickCountry()">🌍</button>
  </div>
  <p class="hello" id="hello"></p>
  <div class="clock" id="clock">--:--</div>
  <div class="date" id="today"></div>

  <button class="hero" onclick="go('asst')">
    <div class="orbmini"></div>
    <div><b data-t="t_asst"></b><span class="small" data-t="t_asst_sub"></span></div>
  </button>

  <div class="glass info" id="homePrayer">🕌 ...</div>
  <div class="glass info" id="homeMed" style="display:none"></div>

  <div class="grid">
    <button class="tile g1" onclick="go('translate')"><span class="ic">🌍</span><span data-t="t_translate"></span></button>
    <button class="tile g2" onclick="go('camera')"><span class="ic">📷</span><span data-t="t_camera"></span></button>
    <button class="tile g3" onclick="go('nav')"><span class="ic">🗺️</span><span data-t="t_nav"></span></button>
    <button class="tile g4" onclick="go('currency')"><span class="ic">💱</span><span data-t="t_currency"></span></button>
    <button class="tile g5" onclick="go('sos')"><span class="ic">🆘</span><span data-t="t_sos"></span></button>
    <button class="tile g6" onclick="go('prayer')"><span class="ic">🕌</span><span data-t="t_prayer"></span></button>
    <button class="tile g7" onclick="go('quran')"><span class="ic">📖</span><span data-t="t_quran"></span></button>
    <button class="tile g8" onclick="go('athkar')"><span class="ic">📿</span><span data-t="t_athkar"></span></button>
    <button class="tile g9" onclick="go('meds')"><span class="ic">💊</span><span data-t="t_meds"></span></button>
    <button class="tile g10" onclick="go('settings')"><span class="ic">⚙️</span><span data-t="settings"></span></button>
  </div>

  <div class="foot">
    <div class="sig">Bin3abdAi</div><div class="tag">نحلم ونحقق</div>
    <div class="links"><button onclick="go('privacy')" data-t="privacy"></button><button onclick="toggleTheme()" data-t="theme_btn"></button></div>
  </div>
</section>

<!-- ===================== ASSISTANT ===================== -->
<section id="asst" class="screen">
  <div class="top"><button class="back" onclick="go('home')" data-t="back"></button><h2 class="title">Bin3abdAi</h2></div>
  <div class="orbwrap"><canvas id="orb"></canvas></div>
  <div class="astate" id="astate"></div>
  <div class="chips" id="asstChips"></div>
  <button class="mic" id="asstMic" style="background:linear-gradient(135deg,var(--accent),var(--accent2))" onclick="micTap('asst')"><span class="ic">🎙️</span><span class="lb" data-t="mic_idle"></span></button>
  <div id="asstMap"></div>
  <div id="asstLog"></div>
  <button class="big alt" onclick="clearAsst()" data-t="new_chat"></button>
  <div class="foot"><div class="sig">Bin3abdAi</div><div class="tag">نحلم ونحقق</div></div>
</section>

<!-- ===================== TRANSLATE ===================== -->
<section id="translate" class="screen">
  <div class="top"><button class="back" onclick="go('home')" data-t="back"></button><h2 class="title" data-t="t_translate"></h2></div>
  <div class="row">
    <button class="pill" id="lpAuto" onclick="setTarget('auto')"></button>
    <button class="pill" id="lpOther" onclick="pickLang()"></button>
  </div>
  <div class="small" id="trHint" style="text-align:center"></div>
  <button class="mic" id="meMic" style="background:linear-gradient(135deg,#16a34a,#14532d);margin-top:10px" onclick="micTap('me')"><span class="ic">🗣️</span><span class="lb" data-t="me_speak"></span></button>
  <button class="mic" id="themMic" style="background:linear-gradient(135deg,#2563eb,#1e3a8a);margin-top:12px" onclick="micTap('them')"><span class="ic">👂</span><span class="lb" data-t="them_speak"></span></button>
  <div id="trOut"></div>
  <h3 data-t="ready_phrases"></h3>
  <div id="phrases"></div>
</section>

<!-- ===================== CAMERA ===================== -->
<section id="camera" class="screen">
  <div class="top"><button class="back" onclick="go('home')" data-t="back"></button><h2 class="title" data-t="t_camera"></h2></div>
  <p class="hint" data-t="cam_hint"></p>
  <input type="file" id="camIn" accept="image/*" capture="environment" style="display:none" onchange="camFile(this)">
  <input type="file" id="camPick" accept="image/*" style="display:none" onchange="camFile(this)">
  <button class="mic g2" style="min-height:130px" onclick="$('camIn').click()"><span class="ic">📷</span><span data-t="cam_take"></span></button>
  <button class="big alt" onclick="$('camPick').click()" data-t="cam_pick"></button>
  <img id="camImg" style="display:none;width:100%;border-radius:18px;margin:10px 0;border:1.5px solid var(--line)" alt="">
  <div class="row" id="camModes" style="display:none;flex-wrap:wrap">
    <button class="pill" data-m="text" onclick="camRun('text')" data-t="mode_text"></button>
    <button class="pill" data-m="menu" onclick="camRun('menu')" data-t="mode_menu"></button>
  </div>
  <div class="row" id="camModes2" style="display:none">
    <button class="pill" data-m="med" onclick="camRun('med')" data-t="mode_med"></button>
    <button class="pill" data-m="what" onclick="camRun('what')" data-t="mode_what"></button>
  </div>
  <div id="camOut"></div>
</section>

<!-- ===================== NAV ===================== -->
<section id="nav" class="screen">
  <div class="top"><button class="back" onclick="go('home')" data-t="back"></button><h2 class="title" data-t="t_nav"></h2></div>
  <button class="mic g3" id="navMic" onclick="micTap('nav')"><span class="ic">🎙️</span><span class="lb" data-t="nav_where"></span></button>
  <div class="row" style="margin-top:8px"><input id="navQ" data-tp="nav_type"><button class="big" style="flex:.35;margin:0" onclick="navText()">➜</button></div>
  <div id="navOut"></div>
  <button class="big green" onclick="navHotel()" data-t="nav_hotel"></button>
  <div class="grid" style="margin-top:6px">
    <button class="pill" onclick="navSearch('mosque')" data-t="nav_mosque"></button>
    <button class="pill" onclick="navSearch('halal restaurant')" data-t="nav_halal"></button>
    <button class="pill" onclick="navSearch('hospital')" data-t="nav_hospital"></button>
    <button class="pill" onclick="navSearch('pharmacy')" data-t="nav_pharmacy"></button>
    <button class="pill" onclick="navSearch('ATM')" data-t="nav_atm"></button>
    <button class="pill" onclick="navSearch('tourist attractions')" data-t="nav_sights"></button>
  </div>
  <button class="big alt" onclick="showHotelToDriver()" data-t="nav_show_driver"></button>
  <button class="big alt" onclick="saveHotelHere()" data-t="nav_save_hotel"></button>
</section>

<!-- ===================== CURRENCY ===================== -->
<section id="currency" class="screen">
  <div class="top"><button class="back" onclick="go('home')" data-t="back"></button><h2 class="title" data-t="t_currency"></h2></div>
  <div class="glass" style="padding:16px">
    <label data-t="cur_amount"></label>
    <input id="curAmt" inputmode="decimal" style="font-size:1.6em;font-weight:800;text-align:center" value="100" oninput="curCalc()">
    <div class="row" style="margin-top:10px;align-items:center">
      <select id="curFrom" onchange="curCalc()"></select>
      <button class="big alt" style="flex:.45;margin:0" onclick="curSwap()">⇅</button>
      <select id="curTo" onchange="curCalc()"></select>
    </div>
    <div class="res" id="curRes">—</div>
    <div class="small" id="curTime" style="text-align:center"></div>
  </div>
  <div class="chips" id="curChips"></div>
  <button class="mic g4" id="curMic" onclick="micTap('cur')"><span class="ic">🎙️</span><span class="lb" data-t="cur_ask"></span></button>
  <div id="curOut"></div>
</section>

<!-- ===================== SOS ===================== -->
<section id="sos" class="screen">
  <div class="top"><button class="back" onclick="go('home')" data-t="back"></button><h2 class="title" data-t="t_sos"></h2></div>
  <h3 id="sosTitle"></h3>
  <div id="sosNums"></div>
  <p class="small" data-t="sos_note"></p>
  <h3 data-t="sos_family"></h3>

async function setUiLang(code){

    if(cached){uiDict=cached}
    else if(cfg.key){
      showAlert('🌐',t('ui_translating'),{noBtn:true});
      try{
        const name=(langOf(code)||[0,0,code])[2];
        const src={...T.en}; delete src.priv;
        const out=await chat([{role:'system',content:`Translate the JSON values into ${name}. Keep keys, emojis, and {placeholders} unchanged. Keep arrays as arrays. Return only JSON.`},{role:'user',content:JSON.stringify(src)}],{temp:0,json:true});

/* ================= AUDIO ================= */
let actx=null,curSrc=null,curAnalyser=null;
function getCtx(){if(!actx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;actx=new C()}if(actx.state==='suspended')actx.resume();return actx}
document.addEventListener('pointerdown',()=>{try{getCtx()}catch(e){}},true);
function stopSpeech(){try{if(curSrc){curSrc.onended=null;curSrc.stop()}}catch(e){}curSrc=null;curAnalyser=null;try{speechSynthesis.cancel()}catch(e){}}
function playBuffer(ab){
  return new Promise(resolve=>{
    const ctx=getCtx();if(!ctx){resolve(false);return}
    ctx.decodeAudioData(ab,buf=>{
      stopSpeech();
      const src=ctx.createBufferSource();src.buffer=buf;
      const an=ctx.createAnalyser();an.fftSize=512;src.connect(an);an.connect(ctx.destination);
      curSrc=src;curAnalyser=an;src.onended=()=>{curAnalyser=null;resolve(true)};src.start(0);
    },()=>resolve(false));
  });
}
const BCP={ar:'ar-SA',en:'en-US',th:'th-TH',fr:'fr-FR',es:'es-ES',de:'de-DE',it:'it-IT',pt:'pt-PT',ru:'ru-RU',tr:'tr-TR',fa:'fa-IR',ur:'ur-PK',hi:'hi-IN',id:'id-ID',ms:'ms-MY',tl:'fil-PH',vi:'vi-VN',zh:'zh-CN',ja:'ja-JP',ko:'ko-KR'};
function browserSpeak(text,lang){try{const u=new SpeechSynthesisUtterance(text);u.lang=BCP[lang]||lang||'en-US';u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
async function speak(text,lang='ar',fast=false){
  if(!text)return;
  if(cfg.key){
    try{
      const body={model:fast?MODEL_TTS_FAST:MODEL_TTS,voice:cfg.voice,input:text.slice(0,3500),response_format:'mp3'};
      if(!fast) body.instructions= lang==='ar'?'تكلّم بالعربي بلهجة سعودية هادئة وواضحة، بنبرة محترمة ودافئة.':'Speak clearly, warmly and at a calm pace.';
      if(fast) body.speed=1.0;
      const r=await fetch('https://api.openai.com/v1/audio/speech',{method:'POST',headers:{'Authorization':'Bearer '+cfg.key,'Content-Type':'application/json'},body:JSON.stringify(body)});
      if(r.ok){const ok=await playBuffer(await r.arrayBuffer());if(ok)return}
    }catch(e){}
  }
  browserSpeak(text,lang);
}

const micState={active:null,rec:null,stream:null,chunks:[],timer:null};
const MIC_IDS={asst:'asstMic',me:'meMic',them:'themMic',pick:'pickMic',nav:'navMic',cur:'curMic'};
function micIdle(which){
  if(which==='them'){const L=langOf(resolveTarget());return t('them_speak')+(cfg.target==='auto'?' ('+t('auto').replace(/^\S+\s/,'')+')':(L?' ('+langName(L)+')':''))}
  if(which==='me') return t('me_speak')+' ('+langName(langOf(myLang()))+')';
  const lb=$(MIC_IDS[which]).querySelector('.lb');return t(lb.dataset.t);
}
function setMicUI(which,mode){
  const b=$(MIC_IDS[which]);if(!b)return;
  b.classList.remove('rec','busy');const lb=b.querySelector('.lb');
  if(mode==='rec'){b.classList.add('rec');lb.textContent=t('listening')}
  else if(mode==='busy'){b.classList.add('busy');lb.textContent=t('wait')}
  else lb.textContent=micIdle(which);
  if(which==='asst') setAState(mode==='rec'?'listening':mode==='busy'?'thinking':'ready');
}
function pickMime(){const c=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/aac'];if(!window.MediaRecorder||!MediaRecorder.isTypeSupported)return'';for(const m of c)if(MediaRecorder.isTypeSupported(m))return m;return''}
let busy=false;
async function micTap(which){
  if(busy)return;
  stopSpeech();
  if(micState.active===which){finishMic();return}
  if(micState.active)cancelMic();
  if(!cfg.key){showAlert('🔑',t('need_key'));return}
  try{micState.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}})}
  catch(e){showAlert('🎙️',t('mic_denied'));return}
  const mime=pickMime();
  micState.rec=new MediaRecorder(micState.stream,mime?{mimeType:mime}:undefined);
  micState.chunks=[];micState.active=which;
  micState.rec.ondataavailable=e=>{if(e.data&&e.data.size)micState.chunks.push(e.data)};
  micState.rec.start();
  if(which==='asst'){try{const ctx=getCtx();const s=ctx.createMediaStreamSource(micState.stream);const an=ctx.createAnalyser();an.fftSize=512;s.connect(an);curAnalyser=an}catch(e){}}
  setMicUI(which,'rec');
  micState.timer=setTimeout(()=>{if(micState.active===which)finishMic()},60000);
}
function releaseMic(){clearTimeout(micState.timer);try{micState.stream&&micState.stream.getTracks().forEach(x=>x.stop())}catch(e){}micState.stream=null;micState.rec=null;micState.active=null;curAnalyser=null}
function cancelMic(){const w=micState.active;try{if(micState.rec){micState.rec.onstop=null;micState.rec.stop()}}catch(e){}releaseMic();if(w)setMicUI(w,'idle')}
function finishMic(){
  const which=micState.active,rec=micState.rec;if(!rec)return;
  rec.onstop=async()=>{
    const blob=new Blob(micState.chunks,{type:rec.mimeType||'audio/webm'});
    releaseMic();busy=true;setMicUI(which,'busy');
    try{await HANDLERS[which](blob)}catch(e){showErr(which,e.message||String(e))}
    busy=false;setMicUI(which,'idle');
  };
  rec.stop();
}
function showErr(which,msg){
  const box={asst:'asstLog',me:'trOut',them:'trOut',nav:'navOut',cur:'curOut',pick:'pkList'}[which];
  if($(box)) $(box).insertAdjacentHTML('afterbegin','<div class="err">'+esc(t('err_retry'))+'<br><span class="small">'+esc(msg)+'</span></div>');
}

/* ================= OPENAI ================= */
async function transcribe(blob,lang){
  if(blob.size<1500)throw new Error(t('heard_nothing'));
  const ty=blob.type,ext=(ty.includes('mp4')||ty.includes('aac'))?'m4a':(ty.includes('ogg')?'ogg':'webm');
  const send=async model=>{const fd=new FormData();fd.append('file',blob,'voice.'+ext);fd.append('model',model);if(lang)fd.append('language',lang);
    return fetch('https://api.openai.com/v1/audio/transcriptions',{method:'POST',headers:{'Authorization':'Bearer '+cfg.key},body:fd})};
  let r=await send(MODEL_STT);
  if(!r.ok && r.status!==401 && r.status!==429) r=await send(MODEL_STT_FALLBACK);
  if(!r.ok)throw new Error('STT '+r.status+': '+(await r.text()).slice(0,160));
  const j=await r.json();return(j.text||'').trim();
}
async function chat(messages,o={}){
  const body={model:o.model||MODEL_CHAT,messages,temperature:o.temp??.5};
  if(o.json)body.response_format={type:'json_object'};
  if(o.max)body.max_tokens=o.max;
  const r=await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',headers:{'Authorization':'Bearer '+cfg.key,'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok)throw new Error('Chat '+r.status+': '+(await r.text()).slice(0,160));
  const j=await r.json();return(j.choices?.[0]?.message?.content||'').trim();
}
function ctxInfo(){

    (lastPos?` Approx. GPS: ${lastPos.lat.toFixed(3)}, ${lastPos.lng.toFixed(3)} (use it to infer the city).`:'')+
    (cfg.hotel&&cfg.hotel.name?` Hotel: ${cfg.hotel.name} ${cfg.hotel.addr||''}.`:'')+
    (cfg.about?` About the user: ${cfg.about}.`:'');
}

/* particle orb */
const orb={pts:[],rot:0,level:0,mode:'ready',raf:0};
(function(){const N=560;for(let i=0;i<N;i++){const y=1-(i/(N-1))*2,r=Math.sqrt(1-y*y),th=Math.PI*(3-Math.sqrt(5))*i;orb.pts.push([Math.cos(th)*r,y,Math.sin(th)*r])}})();
const lvBuf=new Uint8Array(512);
function audioLevel(){if(!curAnalyser)return 0;try{curAnalyser.getByteTimeDomainData(lvBuf);let s=0;for(let i=0;i<lvBuf.length;i++){const v=(lvBuf[i]-128)/128;s+=v*v}return Math.min(1,Math.sqrt(s/lvBuf.length)*4)}catch(e){return 0}}
function startOrb(){cancelAnimationFrame(orb.raf);drawOrb()}
function drawOrb(){
  if(cur!=='asst')return;
  const c=$('orb'),dpr=Math.min(2,window.devicePixelRatio||1),w=c.clientWidth,h=c.clientHeight;
  if(c.width!==w*dpr||c.height!==h*dpr){c.width=w*dpr;c.height=h*dpr}
  const g=c.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,h);
  const rgb=getComputedStyle(document.documentElement).getPropertyValue('--accentRGB').trim()||'34,211,238';
  let target=audioLevel();const tm=performance.now()/1000;
  if(orb.mode==='thinking')target=.18+.12*Math.sin(tm*5);
  if(orb.mode==='ready')target=Math.max(target,.04+.03*Math.sin(tm*1.6));
  orb.level+=(target-orb.level)*.18;orb.rot+=.004+orb.level*.05;
  const cx=w/2,cy=h/2,R=Math.min(w,h)*.30*(1+orb.level*.45);
  const grd=g.createRadialGradient(cx,cy,R*.1,cx,cy,R*1.6);grd.addColorStop(0,`rgba(${rgb},${.28+orb.level*.4})`);grd.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=grd;g.beginPath();g.arc(cx,cy,R*1.6,0,7);g.fill();
  const cr=Math.cos(orb.rot),sr=Math.sin(orb.rot),ct=Math.cos(.35),st=Math.sin(.35);
  for(const p of orb.pts){
    let x=p[0]*cr-p[2]*sr,z=p[0]*sr+p[2]*cr,y=p[1];
    const y2=y*ct-z*st,z2=y*st+z*ct;
    const wob=1+orb.level*.25*Math.sin(tm*6+p[1]*8);
    const px=cx+x*R*wob,py=cy+y2*R*wob,d=(z2+1)/2;
    g.fillStyle=`rgba(${rgb},${.15+d*.85})`;g.beginPath();g.arc(px,py,.6+d*1.8,0,7);g.fill();
  }
  orb.raf=requestAnimationFrame(drawOrb);
}

function matchItems(q){
  const n=norm(q);if(!n)return pk.items;
  const alias=ALIASES[n]||ALIASES[n.replace(/ي$/,'')];
  const strong=pk.items.filter(it=>(alias&&it.id===alias)||it.keys.some(k=>k&&(k===n||k.startsWith(n)||n.startsWith(k)&&k.length>=4)));
  if(strong.length)return strong;
  return pk.items.filter(it=>it.keys.some(k=>k&&k.length>=3&&(k.includes(n)||n.includes(k))));
}
function renderPicker(q){
  if(!pk)return;const items=matchItems(q);
  $('pkList').innerHTML=items.map(it=>`<button class="pkItem" data-id="${esc(it.id)}"><span class="fl">${it.flag||'🌐'}</span><span>${esc(it.label)}<div class="small">${esc(it.sub||'')}</div></span></button>`).join('')||`<div class="hint">${esc(t('no_results'))}</div>`;

let camData=null,camMode='text';
function camFile(inp){
  const f=inp.files&&inp.files[0];inp.value='';if(!f)return;
  const img=new Image();img.onload=()=>{
    const max=1280,sc=Math.min(1,max/Math.max(img.width,img.height));
    const cv=document.createElement('canvas');cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    camData=cv.toDataURL('image/jpeg',.8);$('camImg').src=camData;$('camImg').style.display='block';
    $('camModes').style.display='flex';$('camModes2').style.display='flex';URL.revokeObjectURL(img.src);camRun('text');
  };img.src=URL.createObjectURL(f);
}
async function camRun(mode){
  if(!camData)return;if(!cfg.key){showAlert('🔑',t('need_key'));return}
  camMode=mode;document.querySelectorAll('#camModes .pill,#camModes2 .pill').forEach(b=>b.classList.toggle('sel',b.dataset.m===mode));
  const P={text:'Read all text in the image and translate it. Start with one line saying what this is, then the translation.',
    menu:'This is a restaurant menu. Translate the main dishes with prices. Clearly warn about any dish that contains pork, alcohol or is doubtful for a Muslim. Suggest 2 safe choices.',
    med:'This is a medicine box or label. State the medicine name, the usage written on it and important warnings exactly as written. Do not give your own medical advice; advise confirming with a pharmacist.',
    what:'What is in this image? Explain briefly and usefully for a traveller.'}[mode];
  $('camOut').innerHTML=`<div class="glass info">⏳ ${esc(t('wait'))}</div>`;
  try{
    const r=await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',headers:{'Authorization':'Bearer '+cfg.key,'Content-Type':'application/json'},
      body:JSON.stringify({model:MODEL_VISION,temperature:.2,max_tokens:700,messages:[{role:'system',content:`You help an elderly traveller. ${replyStyle()} Use short clear sentences, no markdown symbols. ${ctxInfo()}`},{role:'user',content:[{type:'text',text:P},{type:'image_url',image_url:{url:camData,detail:'high'}}]}]})});
    if(!r.ok)throw new Error('Vision '+r.status);
    const a=(await r.json()).choices[0].message.content.trim();
    $('camOut').innerHTML=`<div class="bubble ai">${esc(a)}</div><button class="big alt" id="camSay">${esc(t('replay'))}</button>`;

}

const PNAMES=[['Fajr','الفجر','Fajr'],['Sunrise','الشروق','Sunrise'],['Dhuhr','الظهر','Dhuhr'],['Asr','العصر','Asr'],['Maghrib','المغرب','Maghrib'],['Isha','العشاء','Isha']];

function fmt12(hhmm){let[h,m]=hhmm.split(':').map(Number);const s=myLang()==='ar'?(h<12?'ص':'م'):(h<12?'AM':'PM');h=h%12||12;return h+':'+String(m).padStart(2,'0')+' '+s}

async function loadPrayer(force){
  if(!force&&prayer&&prayer.day===dayKey()){renderPrayer();renderHome();return}
  const pos=await getPos();const d=new Date(),ds=String(d.getDate()).padStart(2,'0')+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+d.getFullYear();
  const c=country();
  const url=pos?`https://api.aladhan.com/v1/timings/${ds}?latitude=${pos.lat}&longitude=${pos.lng}&method=${methodFor()}`

let taken=S.get('taken',{});
function todayDoses(){const o=[];meds.forEach((m,i)=>(m.times||[]).forEach(tt=>o.push({i,t:tt,key:i+'_'+tt,name:m.name,note:m.note})));return o.sort((a,b)=>a.t.localeCompare(b.t))}

function nextDose(){const n=new Date(),c=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');return todayDoses().find(d=>!isTaken(d.key)&&d.t>=c)||todayDoses().find(d=>!isTaken(d.key))}

/* ================= ALERTS / TICK ================= */
let aQ=[],aOpen=false;
function showAlert(ic,msg,o={}){aQ.push({ic,msg,o});if(!aOpen)nextAlert()}
function closeAlert(){aQ=[];aOpen=false;$('alertBox').classList.remove('on')}
function nextAlert(){const a=aQ.shift();if(!a){aOpen=false;$('alertBox').classList.remove('on');return}
  aOpen=true;$('alIc').textContent=a.ic;$('alMsg').textContent=a.msg;
  $('alOk').style.display=a.o.noBtn?'none':'block';$('alOk').textContent=a.o.okText||t('ok');$('alOk').onclick=()=>{a.o.onOk&&a.o.onOk();nextAlert()};
  $('alLater').style.display=a.o.onLater?'block':'none';$('alLater').textContent=t('remind_later');$('alLater').onclick=()=>{a.o.onLater();nextAlert()};
  $('alertBox').classList.add('on');if(a.o.say)speak(a.o.say,myLang())}
function beep(){try{const c=getCtx();const o=c.createOscillator(),g=c.createGain();o.frequency.value=880;o.connect(g);g.connect(c.destination);g.gain.value=.25;o.start();setTimeout(()=>o.frequency.value=660,300);setTimeout(()=>o.stop(),700)}catch(e){}}
let fired=S.get('fired',{}),snoozed={};
function tick(){
  const n=new Date(),hm=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0'),day=dayKey();
  if(fired.day!==day)fired={day};
  todayDoses().forEach(d=>{const fk='m_'+d.key,due=(d.t===hm&&!fired[fk])||(snoozed[d.key]&&Date.now()>=snoozed[d.key]);
    if(due&&!isTaken(d.key)){fired[fk]=true;delete snoozed[d.key];beep();
      showAlert('💊',t('med_time')+': '+d.name+(d.note?' — '+d.note:''),{okText:t('taken'),say:t('med_time')+' '+d.name,onOk:()=>markTaken(d.key),onLater:()=>{snoozed[d.key]=Date.now()+15*60000}})}});
  if(prayer&&prayer.day===day){PNAMES.forEach(p=>{if(p[0]==='Sunrise')return;const fk='p_'+p[0];if(prayer.timings[p[0]]===hm&&!fired[fk]){fired[fk]=true;beep();showAlert('🕌',t('prayer_now')+' '+pName(p),{say:t('prayer_now')+' '+pName(p)})}})}
  else loadPrayer(false);
  S.set('fired',fired);if(cur==='home')renderHome();
}

  $('hello').textContent=(n.getHours()<12?t('gm'):t('ge'))+(cfg.name?(myLang()==='ar'?' يا ':', ')+cfg.name:'')+' 👋';
  $('clock').textContent=fmt12(String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0'));
  let dt='';try{dt=n.toLocaleDateString(myLang()==='ar'?'ar-SA-u-nu-latn-ca-gregory':myLang(),{weekday:'long',day:'numeric',month:'long'})}catch(e){}
  $('today').textContent=dt+(prayer&&prayer.day===dayKey()?(' — '+(myLang()==='ar'?prayer.hijri:prayer.hijriEn)):'');
  const c=country();$('destChip').textContent=c?(flag(c[0])+' '+(myLang()==='ar'?c[1]:c[2])):('🌍 '+t('choose_country'));
  const np=nextPrayer();if(np)$('homePrayer').innerHTML=`🕌 ${esc(t('next_prayer'))}: <b>${esc(pName(np.p))}</b> ${esc(t('at'))} ${fmt12(np.t)}<br><span class="small">${esc(t('left'))} ${esc(leftText(np.left))}</span>`;
  const d=nextDose();
  if(!cfg.key){$('homeMed').style.display='block';$('homeMed').innerHTML='🔑 '+esc(t('need_key'))}
  else if(d){$('homeMed').style.display='block';$('homeMed').innerHTML=`💊 ${esc(t('next_med'))}: <b>${esc(d.name)}</b> ${esc(t('at'))} ${fmt12(d.t)}`}
  else $('homeMed').style.display='none';
}

/* ================= SETTINGS ================= */
function fillSettings(){
  const L=langOf(myLang());$('sUiLang').textContent=flag(L&&L[3])+' '+(L?(L[0]==='ar'?'العربية':L[2]):myLang());
  const c=country();$('sDest').textContent=c?(flag(c[0])+' '+(myLang()==='ar'?c[1]:c[2])):t('choose_country');
  $('sKey').value=cfg.key;$('sName').value=cfg.name;$('sAbout').value=cfg.about;$('sVoice').value=cfg.voice;$('sReciter').value=cfg.reciter;$('sMethod').value=cfg.method;
  $('sHomeCur').innerHTML=curList().map(x=>`<option>${x}</option>`).join('');$('sHomeCur').value=cfg.homeCur;
  $('sHotelName').value=(cfg.hotel||{}).name||'';$('sHotelAddr').value=(cfg.hotel||{}).addr||'';
  $('famEdit').innerHTML='';(cfg.family||[]).forEach(f=>addFamRow(f));
  $('medEdit').innerHTML='';meds.forEach(m=>addMedRow(m));if(!meds.length)addMedRow();
  $('sMsg').innerHTML='';
}
function addFamRow(f={name:'',phone:''}){const d=document.createElement('div');d.className='famrow';
  d.innerHTML=`<input class="fN" placeholder="${esc(t('fam_name'))}" value="${esc(f.name)}"><input class="fP" style="margin-top:8px;direction:ltr" inputmode="tel" placeholder="${esc(t('fam_phone'))}" value="${esc(f.phone)}"><button class="big alt" style="padding:10px;font-size:.9em" onclick="this.parentNode.remove()">${esc(t('del'))}</button>`;$('famEdit').appendChild(d)}
function addMedRow(m={name:'',times:[],note:''}){const d=document.createElement('div');d.className='medrow';
  d.innerHTML=`<input class="mN" placeholder="${esc(t('med_name'))}" value="${esc(m.name)}"><input class="mT" style="margin-top:8px;direction:ltr" placeholder="08:00, 20:00" value="${esc((m.times||[]).join(', '))}"><input class="mO" style="margin-top:8px" placeholder="${esc(t('med_note'))}" value="${esc(m.note||'')}"><button class="big alt" style="padding:10px;font-size:.9em" onclick="this.parentNode.remove()">${esc(t('del'))}</button>`;$('medEdit').appendChild(d)}
function normTime(s){const m=s.trim().match(/^(\d{1,2})[:.](\d{2})$/);if(!m)return null;const h=+m[1],mi=+m[2];if(h>23||mi>59)return null;return String(h).padStart(2,'0')+':'+String(mi).padStart(2,'0')}
function saveSettings(){
  const oldM=cfg.method;
  cfg.key=$('sKey').value.trim();cfg.name=$('sName').value.trim();cfg.about=$('sAbout').value.trim();cfg.voice=$('sVoice').value;cfg.reciter=$('sReciter').value;cfg.method=$('sMethod').value;
  if(cfg.homeCur!==$('sHomeCur').value){cfg.homeCur=$('sHomeCur').value;rates=null}
  cfg.hotel=Object.assign(cfg.hotel||{},{name:$('sHotelName').value.trim(),addr:$('sHotelAddr').value.trim()});
  cfg.family=[...document.querySelectorAll('.famrow')].map(r=>({name:r.querySelector('.fN').value.trim(),phone:r.querySelector('.fP').value.replace(/[^\d]/g,'')})).filter(f=>f.phone);
  const bad=[];
  meds=[...document.querySelectorAll('.medrow')].map(r=>({name:r.querySelector('.mN').value.trim(),times:r.querySelector('.mT').value.split(/[,،]/).filter(x=>x.trim()).map(x=>{const v=normTime(x);if(!v)bad.push(x.trim());return v}).filter(Boolean),note:r.querySelector('.mO').value.trim()})).filter(m=>m.name&&m.times.length);
  saveCfg();S.set('meds',meds);
  $('sMsg').innerHTML=bad.length?`<div class="err">${esc(t('bad_times'))} ${esc(bad.join(' ، '))}</div>`:`<div class="glass info">${esc(t('saved'))}</div>`;
  if(oldM!==cfg.method)loadPrayer(true);
}
function exportICS(){
  if(!meds.length){$('sMsg').innerHTML=`<div class="err">${esc(t('add_meds_first'))}</div>`;return}
  const d=new Date(),ymd=d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0'),stamp=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
  let ics='BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Khoy Bin3abdAi//AR\r\nCALSCALE:GREGORIAN\r\n';
  meds.forEach((m,i)=>m.times.forEach(tt=>{const hm=tt.replace(':','');ics+=`BEGIN:VEVENT\r\nUID:khoy-${i}-${hm}-${Date.now()}@khoy\r\nDTSTAMP:${stamp}\r\nDTSTART:${ymd}T${hm}00\r\nDURATION:PT10M\r\nRRULE:FREQ=DAILY\r\nSUMMARY:💊 ${m.name}${m.note?(' - '+m.note):''}\r\nBEGIN:VALARM\r\nACTION:DISPLAY\r\nDESCRIPTION:${m.name}\r\nTRIGGER:PT0M\r\nEND:VALARM\r\nEND:VEVENT\r\n`}));
  ics+='END:VCALENDAR\r\n';const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([ics],{type:'text/calendar;charset=utf-8'}));a.download='meds.ics';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);
}

/* ================= ONBOARDING ================= */
let onbStep=0;
function startOnboarding(){onbStep=0;$('onb').classList.add('on');renderOnb()}
function onbDots(){return`<div class="dots">${[0,1,2,3].map(i=>`<i class="${i===onbStep?'on':''}"></i>`).join('')}</div>`}
function renderOnb(){
  const o=$('onb');const c=country();
  if(onbStep===0){o.innerHTML=`${onbDots()}<div style="text-align:center"><div class="orbmini" style="width:110px;height:110px;margin:0 auto;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,rgba(var(--accentRGB),.9) 30%,var(--accent2) 70%,transparent 72%);box-shadow:0 0 40px rgba(var(--accentRGB),.6);animation:breathe 3s ease-in-out infinite"></div>
    <h1>${esc(t('onb_hi'))}</h1><p class="small" style="font-size:1em">${esc(t('onb_hi2'))}</p><h3>${esc(t('onb_lang'))}</h3></div>
    <div class="row"><button class="pill ${myLang()==='ar'?'sel':''}" onclick="onbLang('ar')">🇸🇦 العربية</button><button class="pill ${myLang()==='en'?'sel':''}" onclick="onbLang('en')">🇬🇧 English</button></div>
    <button class="big alt" onclick="pickUiLang();onbAfterPick()">${esc(t('more_langs'))}</button>
    <button class="big" onclick="onbStep=1;renderOnb()">${esc(t('next_btn'))}</button>`}
  else if(onbStep===1){o.innerHTML=`${onbDots()}<h1>${esc(t('onb_name'))}</h1><input id="onbName" style="font-size:1.2em" placeholder="${esc(t('onb_name_ph'))}" value="${esc(cfg.name)}"><button class="big" onclick="cfg.name=$('onbName').value.trim();saveCfg();onbStep=2;renderOnb()">${esc(t('next_btn'))}</button>`}
  else if(onbStep===2){o.innerHTML=`${onbDots()}<h1>${esc(t('onb_dest'))}</h1><button class="pill sel" style="font-size:1.2em" onclick="pickCountry(renderOnb)">${c?(flag(c[0])+' '+esc(myLang()==='ar'?c[1]:c[2])):'🌍 '+esc(t('choose_country'))}</button><button class="big" onclick="onbStep=3;renderOnb()">${esc(t('next_btn'))}</button>`}
  else{o.innerHTML=`${onbDots()}<h1>${esc(t('onb_key'))}</h1><p class="small" style="font-size:.95em">${esc(t('onb_key_help'))}</p><input id="onbKey" type="password" placeholder="sk-..." value="${esc(cfg.key)}"><a class="small" href="https://platform.openai.com/api-keys" target="_blank" rel="noopener">platform.openai.com/api-keys</a>
    <button class="big green" onclick="cfg.key=$('onbKey').value.trim();finishOnb()">${esc(t('start'))}</button><button class="big alt" onclick="finishOnb()">${esc(t('later'))}</button>`}
}
async function onbLang(code){await setUiLang(code);renderOnb()}
function onbAfterPick(){const iv=setInterval(()=>{if(!$('picker').classList.contains('on')){clearInterval(iv);renderOnb()}},400)}
function finishOnb(){cfg.onboarded=true;saveCfg();$('onb').classList.remove('on');renderAll();loadPrayer(true)}

/* ================= INIT ================= */
const HANDLERS={asst:handleAsst,me:handleMe,them:handleThem,pick:handlePick,nav:handleNav,cur:handleCur};
function renderAll(){applyI18n();renderHome();renderQuran();if(cur==='translate')renderTranslate();if(cur==='sos')renderSOS();if(cur==='settings')fillSettings();if(cur==='prayer')renderPrayer();Object.keys(MIC_IDS).forEach(w=>{if($(MIC_IDS[w]))setMicUI(w,'idle')})}
applyTheme();applyFont();renderAll();
loadPrayer(false);
setInterval(tick,20000);setTimeout(tick,1500);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
if(!cfg.onboarded)startOnboarding();
</script>
