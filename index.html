<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="خوي Bin3abdAi">
<meta name="theme-color" content="#0b1220">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="icon" href="icon-512.png">
<title>خوي Bin3abdAi</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --fs:1.1;
  --bg:#0b1220; --bg2:#0f1a30; --card:rgba(255,255,255,.06); --card2:rgba(255,255,255,.10);
  --line:rgba(148,197,255,.18); --ink:#f1f5f9; --muted:#9fb0c8;
  --accent:#22d3ee; --accent2:#6366f1; --accentRGB:34,211,238;
  --ok:#22c55e; --danger:#ef4444; --shadow:0 10px 30px rgba(0,0,0,.35);
}
html[data-theme="light"]{
  --bg:#eef3f9; --bg2:#ffffff; --card:#ffffff; --card2:#f1f5fb;
  --line:#d3dde9; --ink:#0f172a; --muted:#475569;
  --accent:#0e7490; --accent2:#4f46e5; --accentRGB:14,116,144;
  --shadow:0 8px 22px rgba(15,23,42,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'Tajawal',system-ui,sans-serif;font-size:calc(21px * var(--fs));line-height:1.6}
body{background:radial-gradient(1200px 600px at 100% -10%,rgba(var(--accentRGB),.16),transparent 60%),radial-gradient(900px 500px at -10% 10%,rgba(99,102,241,.14),transparent 60%),var(--bg);background-attachment:fixed;padding:calc(env(safe-area-inset-top) + 6px) 14px calc(env(safe-area-inset-bottom) + 24px)}
button{font-family:inherit;font-size:1em;cursor:pointer;border:0;color:inherit}
input,textarea,select{font-family:inherit;font-size:.92em;width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--card2);color:var(--ink);outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(var(--accentRGB),.25)}
label{display:block;font-weight:700;margin:16px 0 6px}
a{color:var(--accent)}
.screen{display:none;padding-bottom:30px;animation:fade .25s ease}
.screen.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.top{display:flex;align-items:center;gap:12px;margin:6px 0 16px;position:sticky;top:0;z-index:5;padding:8px 0;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.back{background:var(--card2);border:1.5px solid var(--line);border-radius:16px;padding:11px 18px;font-weight:800}
.title{font-size:1.35em;font-weight:800;margin:0}
.glass{background:var(--card);border:1.5px solid var(--line);border-radius:22px;box-shadow:var(--shadow);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.info{padding:14px 16px;margin:12px 0;font-weight:700}
.small{font-size:.82em;color:var(--muted);font-weight:500}
.hint{color:var(--muted);font-size:.9em;text-align:center;margin:10px 0}
.row{display:flex;gap:10px}.row>*{flex:1}
.brandbar{display:flex;align-items:center;justify-content:space-between;margin:4px 0 10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800}
.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-size:1.2em;box-shadow:0 0 22px rgba(var(--accentRGB),.45)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:var(--card2);border:1.5px solid var(--line);font-weight:700;font-size:.85em}
.hello{font-size:1.45em;font-weight:800;margin:6px 0 0}
.clock{font-size:2.5em;font-weight:800;line-height:1.1;margin:2px 0;letter-spacing:.5px}
.date{color:var(--muted)}
.hero{display:flex;align-items:center;gap:16px;padding:18px;margin:14px 0;border-radius:26px;background:linear-gradient(135deg,rgba(var(--accentRGB),.22),rgba(99,102,241,.25));border:1.5px solid rgba(var(--accentRGB),.45);width:100%;text-align:start;box-shadow:0 0 30px rgba(var(--accentRGB),.18)}
.hero .orbmini{width:74px;height:74px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 30%,#fff,rgba(var(--accentRGB),.9) 30%,var(--accent2) 70%,transparent 72%);box-shadow:0 0 30px rgba(var(--accentRGB),.6);animation:breathe 3s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.06);box-shadow:0 0 45px rgba(var(--accentRGB),.85)}}
.hero b{font-size:1.25em;display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border-radius:22px;min-height:132px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:800;font-size:1.02em;color:#fff;box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.18);position:relative;overflow:hidden;text-align:center;padding:10px}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.18),transparent 45%)}
.tile .ic{font-size:2.3em;line-height:1}
.tile:active,.big:active,.mic:active,.hero:active{transform:scale(.97)}
.g1{background:linear-gradient(135deg,#2563eb,#1e3a8a)}.g2{background:linear-gradient(135deg,#7c3aed,#4c1d95)}
.g3{background:linear-gradient(135deg,#0d9488,#115e59)}.g4{background:linear-gradient(135deg,#059669,#065f46)}
.g5{background:linear-gradient(135deg,#dc2626,#7f1d1d)}.g6{background:linear-gradient(135deg,#0891b2,#164e63)}
.g7{background:linear-gradient(135deg,#16a34a,#14532d)}.g8{background:linear-gradient(135deg,#9333ea,#581c87)}
.g9{background:linear-gradient(135deg,#e11d48,#881337)}.g10{background:linear-gradient(135deg,#475569,#1e293b)}
.big{width:100%;border-radius:18px;padding:17px;font-weight:800;font-size:1.08em;color:#fff;margin:8px 0;box-shadow:var(--shadow);background:linear-gradient(135deg,var(--accent),var(--accent2))}
.big.alt{background:var(--card2);color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.big.red{background:linear-gradient(135deg,#ef4444,#991b1b)}
.big.green{background:linear-gradient(135deg,#22c55e,#166534)}
.mic{width:100%;min-height:150px;border-radius:26px;color:#fff;font-size:1.25em;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:16px;box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.2)}
.mic .ic{font-size:2.6em;line-height:1}
.mic.rec{background:linear-gradient(135deg,#ef4444,#991b1b)!important;animation:pulse 1.2s infinite}
.mic.busy{background:linear-gradient(135deg,#64748b,#334155)!important}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(239,68,68,.6)}100%{box-shadow:0 0 0 22px rgba(239,68,68,0)}}
.bubble{padding:14px 16px;margin:12px 0;font-size:1.05em;white-space:pre-wrap;border-radius:20px;border:1.5px solid var(--line);background:var(--card)}
.bubble.me{border-color:rgba(34,197,94,.45)}
.bubble.ai{border-color:rgba(var(--accentRGB),.5)}
.pill{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:13px 14px;font-weight:800;margin:6px 0;text-align:start;width:100%}
.pill.sel{border-color:var(--accent);background:rgba(var(--accentRGB),.16);box-shadow:0 0 0 2px rgba(var(--accentRGB),.25)}
.pt{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;margin:10px 0;font-size:1.2em;font-weight:800}
.pt.next{border-color:var(--accent);background:rgba(var(--accentRGB),.14)}
.med{padding:14px 16px;margin:12px 0}
.med.done{border-color:rgba(34,197,94,.6)}
.med .n{font-size:1.2em;font-weight:800}
.dhikr{padding:20px;font-size:1.3em;line-height:2;margin:12px 0;text-align:center}
.count{font-size:2.1em;font-weight:800;text-align:center}
.qbar{position:sticky;bottom:8px;border-radius:22px;padding:12px;margin-top:14px;text-align:center;background:linear-gradient(135deg,#0d9488,#1e3a8a);color:#fff;box-shadow:var(--shadow)}
.qbar .nm{font-size:1.25em;font-weight:800}
.qbar .row button{background:rgba(255,255,255,.95);color:#0f172a;border-radius:14px;padding:13px;font-size:1.35em;font-weight:800}
.overlay{position:fixed;inset:0;background:rgba(2,6,23,.82);display:none;align-items:center;justify-content:center;z-index:50;padding:18px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.overlay.on{display:flex}
.modal{background:var(--bg2);border:1.5px solid var(--line);border-radius:26px;padding:24px;width:100%;max-width:520px;text-align:center;box-shadow:var(--shadow)}
.modal .ic{font-size:3.6em}
.modal .msg{font-size:1.4em;font-weight:800;margin:8px 0 16px}
.show{position:fixed;inset:0;background:#fff;color:#000;z-index:60;display:none;flex-direction:column;justify-content:center;padding:24px;text-align:center}
.show.on{display:flex}
.show .t{font-size:2.2em;font-weight:800;line-height:1.5}
.show .s{font-size:1.05em;color:#555;margin-top:18px}
.foot{text-align:center;margin:28px 0 6px}
.foot .sig{font-weight:800;font-size:1.05em;letter-spacing:.5px;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.foot .tag{font-size:.75em;color:var(--muted);letter-spacing:2px;margin-top:2px}
.foot .links{display:flex;gap:10px;justify-content:center;margin-top:12px}
.foot .links button{background:var(--card2);border:1.5px solid var(--line);border-radius:999px;padding:9px 16px;font-weight:700;font-size:.85em}
.medrow,.famrow{border:1.5px dashed var(--line);border-radius:14px;padding:10px;margin:10px 0}
.err{background:rgba(239,68,68,.12);border:1.5px solid rgba(239,68,68,.6);border-radius:16px;padding:12px;margin:10px 0;font-weight:700}

/* ===== brand mark ===== */
.bm{display:inline-flex;align-items:center;gap:10px;direction:rtl}
.bm-logo{width:44px;height:44px;flex:none;filter:drop-shadow(0 0 10px rgba(var(--accentRGB),.55))}
.bm-logo .hex{animation:spinhex 12s linear infinite;transform-origin:50% 50%}
.bm-logo .core{animation:corepulse 2.4s ease-in-out infinite;transform-origin:50% 50%}
@keyframes spinhex{to{transform:rotate(360deg)}}
@keyframes corepulse{50%{transform:scale(1.25);opacity:.75}}
.bm-txt{display:flex;flex-direction:column;line-height:1.05}
.bm-ar{font-weight:800;font-size:1.35em;background:linear-gradient(90deg,var(--accent),#a5f3fc,var(--accent2),var(--accent));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
.bm-en{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.68em;letter-spacing:2.5px;color:var(--muted);direction:ltr;text-align:right}
.bm-en b{color:var(--accent);font-weight:800}
.bm-en::after{content:"_";color:var(--accent);animation:blink 1s steps(1) infinite;margin-left:1px}
@keyframes shine{to{background-position:300% 0}}
@keyframes blink{50%{opacity:0}}
/* big version (splash) */
.bm.bmxl{flex-direction:column;gap:14px}
.bm.bmxl .bm-logo{width:120px;height:120px}
.bm.bmxl .bm-ar{font-size:3.4em;letter-spacing:1px;text-shadow:none}
.bm.bmxl .bm-en{font-size:1.15em;letter-spacing:6px;text-align:center;white-space:nowrap;clip-path:inset(0 100% 0 0);animation:typing 1.4s steps(9) .4s forwards}
.bm.bmxl .bm-txt{align-items:center}
@keyframes typing{to{clip-path:inset(0 0 0 0)}}
[data-theme="light"] .bm-ar{background-image:linear-gradient(90deg,#0891b2,#4f46e5,#7c3aed,#0891b2)}
.bm-tag{margin-top:6px;font-size:.95em;letter-spacing:8px;color:var(--muted);opacity:0;animation:fadeup .9s ease 1.9s forwards}
.bm-tag::before,.bm-tag::after{content:"";display:inline-block;width:28px;height:1px;background:linear-gradient(90deg,transparent,var(--accent));vertical-align:middle;margin:0 10px}
.bm-tag::after{background:linear-gradient(90deg,var(--accent),transparent)}
@keyframes fadeup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* Bin3abdAi character + new onboarding */
.char{position:relative;display:grid;place-items:end center}
.char img{height:100%;filter:drop-shadow(0 10px 24px rgba(0,0,0,.55)) drop-shadow(0 0 18px rgba(var(--accentRGB),.35));animation:charIdle 4s ease-in-out infinite;transform-origin:50% 100%}
.char.talk img{animation:charTalk .45s ease-in-out infinite}
.char::before{content:"";position:absolute;bottom:2%;left:50%;width:70%;height:14%;transform:translateX(-50%);border-radius:50%;background:radial-gradient(rgba(var(--accentRGB),.55),transparent 70%);filter:blur(4px);animation:corepulse 2.4s ease-in-out infinite}
@keyframes charIdle{50%{transform:translateY(-6px)}}
@keyframes charTalk{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-3px) scale(1.012)}}
.ob{position:fixed;inset:0;z-index:66;display:none;flex-direction:column;background:radial-gradient(120% 70% at 50% 0%,rgba(var(--accentRGB),.18),transparent 60%),var(--bg);overflow:auto}
.ob.on{display:flex}
.ob .obTop{display:flex;align-items:flex-end;gap:8px;padding:16px 12px 0}
.ob .obTop .char{flex:none}
.ob .bub{flex:1;position:relative;margin-bottom:60px;padding:14px 16px;border-radius:20px 20px 20px 4px;background:var(--card);border:1.5px solid rgba(var(--accentRGB),.45);box-shadow:0 0 24px rgba(var(--accentRGB),.18);font-weight:700;font-size:1.08em;line-height:1.6;min-height:70px}
.ob .bub .who{font-family:ui-monospace,Menlo,monospace;font-size:.72em;letter-spacing:1.5px;color:var(--accent);margin-bottom:4px;direction:ltr;text-align:right}
.ob .bub .why{display:block;margin-top:6px;font-size:.8em;font-weight:600;opacity:.75}
.ob .obBody{padding:6px 16px 28px}
.ob .prog{display:flex;gap:6px;justify-content:center;margin:6px 0 14px}
.ob .prog i{width:22px;height:5px;border-radius:9px;background:var(--line)}
.ob .prog i.on{background:linear-gradient(90deg,var(--accent),var(--accent2));width:34px}
.obGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.obCard{padding:18px 12px;border-radius:22px;background:var(--card);border:1.5px solid var(--line);text-align:center;font-weight:800;font-size:1.1em;color:var(--ink);position:relative;overflow:hidden}
.obCard .e{display:block;font-size:2em;margin-bottom:6px}
.obCard small{display:block;font-weight:600;font-size:.72em;opacity:.7;margin-top:4px}
.obCard.sel{border-color:transparent;background:linear-gradient(135deg,rgba(var(--accentRGB),.35),rgba(99,102,241,.35));box-shadow:0 0 0 2px var(--accent),0 0 26px rgba(var(--accentRGB),.35)}
.obLangBtn{display:flex;align-items:center;gap:14px;width:100%;padding:18px;border-radius:22px;border:1.5px solid rgba(var(--accentRGB),.5);background:linear-gradient(135deg,rgba(var(--accentRGB),.15),rgba(99,102,241,.15));color:var(--ink);font-weight:800;font-size:1.15em;margin:10px 0}
.obLangBtn .g{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-size:1.7em;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 0 18px rgba(var(--accentRGB),.5)}
.obLangBtn .t{flex:1;text-align:start}.obLangBtn .t small{display:block;font-size:.7em;font-weight:600;opacity:.75}
.obMic{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:16px;border-radius:999px;margin:12px 0;font-weight:800;font-size:1.1em;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 8px 26px rgba(var(--accentRGB),.4)}
.obMic.rec{background:linear-gradient(135deg,#ef4444,#b91c1c);animation:corepulse 1.2s infinite}
.split{margin:8px 0}.split .rowb{display:flex;align-items:center;gap:8px;margin:6px 0;font-weight:700}.split .rowb span:first-child{width:110px}
.split .bar{flex:1;height:12px;border-radius:9px;background:rgba(148,163,184,.18);overflow:hidden}.split .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.split .rowb b{width:90px;text-align:end;font-family:ui-monospace,Menlo,monospace;font-size:.9em;direction:ltr}
#homeChar{position:absolute;inset:0;margin:auto;height:100%;pointer-events:none}
/* radar splash */
.radar{position:relative;width:230px;height:230px;display:grid;place-items:center;border-radius:50%;
 background:repeating-radial-gradient(circle,transparent 0 37px,rgba(var(--accentRGB),.22) 38px 39px),radial-gradient(circle,rgba(var(--accentRGB),.10),transparent 70%);
 border:1.5px solid rgba(var(--accentRGB),.35);overflow:hidden}
.radar::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,rgba(var(--accentRGB),.55),rgba(var(--accentRGB),.12) 40deg,transparent 70deg);animation:sweep 2.6s linear infinite}
.radar::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:linear-gradient(transparent,rgba(var(--accentRGB),.35),transparent)}
.radar .hz{position:absolute;top:50%;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(var(--accentRGB),.35),transparent)}
.radar .blip{position:absolute;width:7px;height:7px;border-radius:50%;background:#67e8f9;box-shadow:0 0 10px #22d3ee;opacity:0;animation:blip 2.6s linear infinite}
.radar .blip.lock{width:12px;height:12px;background:#22c55e;box-shadow:0 0 0 0 rgba(34,197,94,.7);animation:lockon 1.4s ease-out 2.2s infinite;opacity:0}
.radar .bm-logo{position:relative;z-index:2}
@keyframes sweep{to{transform:rotate(360deg)}}
@keyframes blip{0%,8%{opacity:0}12%{opacity:1}60%{opacity:.15}100%{opacity:0}}
@keyframes lockon{0%{opacity:1;box-shadow:0 0 0 0 rgba(34,197,94,.7)}100%{opacity:1;box-shadow:0 0 0 18px rgba(34,197,94,0)}}
.radarLock{margin-top:12px;font-weight:800;font-family:ui-monospace,Menlo,monospace;letter-spacing:1px;color:#22c55e;opacity:0;animation:fadeup .6s ease 2.3s forwards;direction:rtl}
/* done toast + dashboard */
#doneToast{white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis;font-size:.95em;position:fixed;top:18px;left:50%;transform:translateX(-50%) translateY(-120px);z-index:70;padding:12px 22px;border-radius:999px;font-weight:800;color:#fff;background:linear-gradient(135deg,#22c55e,#0f766e);box-shadow:0 8px 30px rgba(34,197,94,.45);transition:transform .35s cubic-bezier(.2,1.4,.4,1)}
#doneToast.on{transform:translateX(-50%) translateY(0)}
.dash{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
.ring{position:relative;text-align:center;padding:10px 4px;border-radius:20px;background:var(--card);border:1.5px solid var(--line)}
.ring svg{width:84px;height:84px;transform:rotate(-90deg)}
.ring .rv{position:absolute;top:36px;left:0;right:0;font-weight:800;font-family:ui-monospace,Menlo,monospace;font-size:1.05em}
.ring .rl{font-size:.82em;font-weight:700;margin-top:2px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:10px 0}
.kpi{padding:14px;border-radius:18px;background:var(--card);border:1.5px solid var(--line)}
.kpi b{display:block;font-size:1.7em;font-family:ui-monospace,Menlo,monospace;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.bars{display:flex;gap:6px;align-items:flex-end;height:110px;padding:10px;border-radius:18px;background:var(--card);border:1.5px solid var(--line);margin:10px 0}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:.7em;gap:4px}
.bars i{display:block;width:100%;border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,var(--accent),var(--accent2));min-height:3px;transition:height .6s}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chips button{padding:8px 14px;border-radius:999px;background:var(--card2);border:1.5px solid var(--line);font-weight:700;color:var(--ink)}
.chips button.sel{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent}
.tl{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);margin:6px 0;font-weight:600}
.tl .tm{font-family:ui-monospace,Menlo,monospace;opacity:.7;font-size:.85em;direction:ltr}
.pitem{padding:12px;border-radius:16px;background:var(--card);border:1.5px solid var(--line);margin:8px 0}
.pitem.done{opacity:.55;border-color:#22c55e}
.pitem .ph{display:flex;gap:8px;align-items:center;font-weight:800}
.pitem .ph .tm{font-family:ui-monospace,Menlo,monospace;color:var(--accent);direction:ltr}
.opt{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.opt button{padding:12px 14px;border-radius:16px;background:var(--card2);border:1.5px solid var(--line);font-weight:700;color:var(--ink);font-size:1em}
.opt button.sel{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent}
/* rating bar */
#rateBar{position:fixed;left:12px;right:12px;bottom:14px;z-index:60;display:none;padding:14px;border-radius:20px;background:var(--card);border:1.5px solid var(--line);box-shadow:0 10px 40px rgba(0,0,0,.45);backdrop-filter:blur(14px)}
#rateBar.on{display:block;animation:fadeup .35s ease}
#rateBar .rq{font-weight:800;text-align:center;margin-bottom:8px}
#rateBar .rbtns{display:flex;gap:10px;justify-content:center}
#rateBar .rbtns button{flex:1;font-size:1.9em;padding:10px;border-radius:16px;background:var(--card2);border:1.5px solid var(--line)}
#rateBar .rx{position:absolute;top:6px;left:10px;font-size:1.2em;opacity:.6;background:none}
/* picker */
.pk{position:fixed;inset:0;z-index:55;background:var(--bg);display:none;flex-direction:column;padding:calc(env(safe-area-inset-top) + 10px) 14px 14px}
.pk.on{display:flex}
.pk .list{overflow:auto;flex:1;margin-top:10px}
.pkItem{display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;margin:7px 0;font-weight:800}
.pkItem .fl{font-size:1.6em}
.pkMic{width:100%;border-radius:16px;padding:14px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));margin-top:8px;display:flex;align-items:center;justify-content:center;gap:8px}
.pkMic .ic{font-size:1.3em}
.pkMic.rec{background:linear-gradient(135deg,#ef4444,#991b1b);animation:pulse 1.2s infinite}
.pkMic.busy{background:#475569}
/* assistant */
#asst{padding-bottom:10px}
.orbwrap{position:relative;height:min(58vw,300px);margin:4px auto 0;display:grid;place-items:center}
#orb{width:100%;height:100%}
.astate{text-align:center;font-weight:800;color:var(--accent);letter-spacing:1px;min-height:1.6em}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.chips button{background:var(--card2);border:1.5px solid var(--line);border-radius:999px;padding:10px 14px;font-weight:700;font-size:.85em}
.boot{position:fixed;inset:0;z-index:70;background:#030712;color:#a5f3fc;display:none;flex-direction:column;align-items:center;justify-content:center;font-family:ui-monospace,Menlo,monospace;gap:10px}
.boot.on{display:flex}
.boot .ring{width:120px;height:120px;border-radius:50%;border:3px solid rgba(34,211,238,.2);border-top-color:#22d3ee;animation:spin 1s linear infinite;box-shadow:0 0 40px rgba(34,211,238,.35)}
@keyframes spin{to{transform:rotate(360deg)}}
.boot .lines{min-height:5em;text-align:center;font-size:.85em;line-height:1.7}
.boot .bar{width:220px;height:6px;border-radius:9px;background:rgba(34,211,238,.15);overflow:hidden}
.boot .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#22d3ee,#6366f1);transition:width .25s}
/* onboarding */
.onb{position:fixed;inset:0;z-index:65;background:var(--bg);display:none;flex-direction:column;justify-content:center;padding:24px 18px}
.onb.on{display:flex}
.onb h1{font-size:1.7em;margin:.2em 0}
.dots{display:flex;gap:6px;justify-content:center;margin-bottom:18px}
.dots i{width:9px;height:9px;border-radius:9px;background:var(--line)}.dots i.on{width:26px;background:var(--accent)}
.tr-l{direction:ltr;text-align:left}
.res{font-size:2.2em;font-weight:800;text-align:center;margin:8px 0;word-break:break-word}
</style>
</head>

priv:`<p><b>خصوصيتك تهمنا.</b></p><p>• كل إعداداتك (الاسم، الأدوية، أرقام العائلة، المفتاح) تنحفظ على جوالك فقط، وما نحتفظ بأي نسخة منها.</p><p>• لما تستخدم المساعد أو المترجم أو الكاميرا، يُرسل صوتك أو نصك أو صورتك إلى OpenAI لمعالجتها فقط، وفق سياسة OpenAI.</p><p>• الموقع يُستخدم لأوقات الصلاة والإرشاد. وإذا فعّلت «مشاركة الموقع مع العائلة» يُرسل عبر خدمة ntfy.sh برمز سري خاص فيكم، ويُحذف من الخدمة بعد 12 ساعة تقريباً.</p><p>• اسم الحي من BigDataCloud، والطقس من Open-Meteo.</p><p>• التقييم والاقتراحات تنرسل للمطوّر مع اسمك والدولة فقط (بدون موقع)، وتقدر توقف طلب التقييم من الإعدادات.</p><p>• اللي تعلّمه لخوي ينحفظ في جوالك ويُرسل مع أسئلتك للذكاء الاصطناعي.</p><p>• ما فيه إعلانات ولا تتبّع.</p><p>• تقدر تمسح كل بياناتك بحذف التطبيق من الشاشة الرئيسية أو مسح بيانات المتصفح.</p>`,

/* particle orb */
const orb={pts:[],rot:0,level:0,mode:'ready',raf:0};
(function(){const N=560;for(let i=0;i<N;i++){const y=1-(i/(N-1))*2,r=Math.sqrt(1-y*y),th=Math.PI*(3-Math.sqrt(5))*i;orb.pts.push([Math.cos(th)*r,y,Math.sin(th)*r])}})();
const lvBuf=new Uint8Array(512);
function audioLevel(){if(!curAnalyser)return 0;try{curAnalyser.getByteTimeDomainData(lvBuf);let s=0;for(let i=0;i<lvBuf.length;i++){const v=(lvBuf[i]-128)/128;s+=v*v}return Math.min(1,Math.sqrt(s/lvBuf.length)*4)}catch(e){return 0}}
function startOrb(){cancelAnimationFrame(orb.raf);drawOrb()}
function drawOrb(){
  if(cur!=='home')return;
  const c=$('orb'),dpr=Math.min(2,window.devicePixelRatio||1),w=c.clientWidth,h=c.clientHeight;
  if(c.width!==w*dpr||c.height!==h*dpr){c.width=w*dpr;c.height=h*dpr}
  const g=c.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,h);
  const rgb=getComputedStyle(document.documentElement).getPropertyValue('--accentRGB').trim()||'34,211,238';
  let target=audioLevel();const tm=performance.now()/1000;
  if(orb.mode==='thinking')target=.18+.12*Math.sin(tm*5);
  if(orb.mode==='ready')target=Math.max(target,.04+.03*Math.sin(tm*1.6));
  orb.level+=(target-orb.level)*.18;orb.rot+=.004+orb.level*.05;
  const cx=w/2,cy=h/2,R=Math.min(w,h)*.30*(1+orb.level*.45);
  const grd=g.createRadialGradient(cx,cy,R*.1,cx,cy,R*1.6);grd.addColorStop(0,`rgba(${rgb},${.28+orb.level*.4})`);grd.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=grd;g.beginPath();g.arc(cx,cy,R*1.6,0,7);g.fill();
  const cr=Math.cos(orb.rot),sr=Math.sin(orb.rot),ct=Math.cos(.35),st=Math.sin(.35);
  for(const p of orb.pts){
    let x=p[0]*cr-p[2]*sr,z=p[0]*sr+p[2]*cr,y=p[1];
    const y2=y*ct-z*st,z2=y*st+z*ct;
    const wob=1+orb.level*.25*Math.sin(tm*6+p[1]*8);
    const px=cx+x*R*wob,py=cy+y2*R*wob,d=(z2+1)/2;
    g.fillStyle=`rgba(${rgb},${.15+d*.85})`;g.beginPath();g.arc(px,py,.6+d*1.8,0,7);g.fill();
  }
  orb.raf=requestAnimationFrame(drawOrb);
}

function taxiRates(){const c=country();if(c&&TAXI_RATES[c[0]])return Object.assign({cur:c[3],official:true},TAXI_RATES[c[0]]);

function hav(a,b){const R=6371,dLa=(b.lat-a.lat)*Math.PI/180,dLo=(b.lng-a.lng)*Math.PI/180,x=Math.sin(dLa/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function taxiFare(){const r=taxiRates();let f=r.flag,d=Math.max(0,tx.dist-r.flagKm),prev=r.flagKm;
  for(const[upto,rate]of r.tiers){if(d<=0)break;const span=Math.min(d,upto-prev);if(span>0){f+=span*rate;d-=span}prev=upto}
  return f+tx.wait/60*r.waitPerMin}

function qiblaBearing(p){const k={lat:21.4225,lng:39.8262},r=x=>x*Math.PI/180;const y=Math.sin(r(k.lng-p.lng))*Math.cos(r(k.lat)),x=Math.cos(r(p.lat))*Math.sin(r(k.lat))-Math.sin(r(p.lat))*Math.cos(r(k.lat))*Math.cos(r(k.lng-p.lng));return(Math.atan2(y,x)*180/Math.PI+360)%360}

  $('qbInfo').textContent='⏳';const p=await getPos(true);if(!p){$('qbInfo').textContent=t('loc_denied');return}
  qb.bearing=qiblaBearing(p);qb.said=false;
  if(!qb.on){qb.on=true;const h=e=>{let hd=e.webkitCompassHeading!=null?e.webkitCompassHeading:(e.absolute&&e.alpha!=null?360-e.alpha:null);if(hd==null)return;qb.heading=hd;renderQibla()};
    window.addEventListener('deviceorientationabsolute',h,true);window.addEventListener('deviceorientation',h,true)}

}

  if(!hasAI()){showAlert('🔑',t('need_key'));return}

function recordUntilSilence(){return new Promise(res=>{
  const ctx=getCtx(),src=ctx.createMediaStreamSource(convo.stream),an=ctx.createAnalyser();an.fftSize=1024;src.connect(an);
  const mime=pickMime();const rec=new MediaRecorder(convo.stream,mime?{mimeType:mime}:undefined);convo.rec=rec;const ch=[];
  rec.ondataavailable=e=>{if(e.data&&e.data.size)ch.push(e.data)};
  let spoke=false,lastLoud=Date.now(),start=Date.now();const buf=new Uint8Array(1024);
  const iv=setInterval(()=>{if(!convo.on){clearInterval(iv);try{rec.stop()}catch(e){}return}
    an.getByteTimeDomainData(buf);let sm=0;for(const v of buf){const x=(v-128)/128;sm+=x*x}const rms=Math.sqrt(sm/buf.length);
    if(rms>0.035){spoke=true;lastLoud=Date.now()}
    const now=Date.now();
    if((spoke&&now-lastLoud>1300)||now-start>30000||(!spoke&&now-start>9000)){clearInterval(iv);try{rec.stop()}catch(e){}}
  },100);
  rec.onstop=()=>{try{src.disconnect()}catch(e){}res(spoke?new Blob(ch,{type:rec.mimeType||'audio/webm'}):null)};
  rec.start();
})}

    convoUI('🎙️ '+t('listening'));
    const blob=await recordUntilSilence();if(!convo.on)break;if(!blob)continue;
    try{
      convoUI('🔄 '+t('translating'));
      const text=await transcribe(blob,'');if(!text)continue;
      const tgt=resolveTarget(),TL=langOf(tgt);
      const out=await chat([{role:'system',content:`Live interpreter between a ${myLangName()} speaker and a ${TL?TL[2]:'foreign'} speaker. Detect the language of the text. If it is ${myLangName()}, translate it into natural polite ${TL?TL[2]:'English'}${tgt==='th'?' (use ครับ)':''}. Otherwise translate it into ${myLangName()}${myLang()==='ar'?' (simple Saudi Bedouin-friendly Arabic)':''}. Keep names, numbers, prices exact. Reply ONLY JSON {"lang":"<ISO 639-1>","translation":"..."}`},{role:'user',content:text}],{temp:0,json:true,max:500});
      const j=JSON.parse(out);const lang=(j.lang||'').slice(0,3);const toMine=lang!==myLang();
      if(toMine&&lang){S.set('lastLang',lang)}
      const to=toMine?myLang():tgt;const L=langOf(toMine?lang:myLang());
      trCard((toMine?t('they_said'):t('said'))+(L?' ('+langName(L)+')':''),text,'',j.translation||'',to);
      convoUI('🔊 '+t('speaking'));
      logDone('translate',(j.translation||'').slice(0,60),{silent:true});
      await speak(j.translation||'',to,true);
    }catch(e){showErr('me',e.message||String(e))}
  }
  convoUI('');askRate('convo','');
}

function rid(n){const a=new Uint8Array(n);crypto.getRandomValues(a);return [...a].map(x=>'abcdefghijkmnpqrstuvwxyz23456789'[x%32]).join('')}

async function ntfyPub(topic,obj){try{await fetch('https://ntfy.sh/',{method:'POST',body:JSON.stringify(Object.assign({topic},obj))})}catch(e){}}
async function sendLoc(kind,extra){
  if(!cfg.shareLoc||!cfg.famTopic)return;
  const p=(kind==='loc')?await getPos():await getPos(true);if(!p)return;
  const payload={k:kind,lat:+p.lat.toFixed(6),lng:+p.lng.toFixed(6),acc:p.acc||null,area:area&&area.name||'',cc:country()?country()[0]:'',ts:Date.now(),name:cfg.name||'',hotel:(cfg.hotel&&cfg.hotel.lat!=null)?{lat:cfg.hotel.lat,lng:cfg.hotel.lng}:null};
  if(extra)Object.assign(payload,extra);
  ntfyPub(cfg.famTopic,{message:JSON.stringify(payload),tags:['round_pushpin']});
  if(kind!=='loc'){const link=`https://maps.google.com/?q=${payload.lat},${payload.lng}`;
    ntfyPub(cfg.famTopic+'-alert',{title:kind==='sos'?'🆘 '+(cfg.name||'')+' يحتاج مساعدة':'👋 '+(cfg.name||'')+' بخير',message:(payload.area?('📍 '+payload.area+'\n'):'')+link,priority:kind==='sos'?5:3,click:link})}
}
let lastLocSent=0;
function locHeartbeat(){if(!cfg.shareLoc)return;if(Date.now()-lastLocSent<5*60e3)return;lastLocSent=Date.now();sendLoc('loc')}
async function imFine(){

  else if(!cfg.shareLoc)showAlert('👨‍👩‍👦',t('no_family'));
}

/* --- son's family page --- */
let famTopic=null,famTimer=null,famData=[];
async function famFetch(topic){const r=await fetch(`https://ntfy.sh/${topic}/json?poll=1&since=12h`);const txt=await r.text();return txt.split('\n').filter(Boolean).map(l=>{try{return JSON.parse(l)}catch(e){return null}}).filter(m=>m&&m.event==='message')}
async function famRefresh(){
  if(!famTopic)return;$('famLast').textContent='⏳';
  try{const msgs=await famFetch(famTopic);famData=msgs.map(m=>{try{return JSON.parse(m.message)}catch(e){return null}}).filter(Boolean).sort((a,b)=>b.ts-a.ts)}catch(e){$('famLast').textContent=t('fam_fail');return}
  renderFamily();
}
function ago(ts){const m=Math.round((Date.now()-ts)/60000);if(m<1)return myLang()==='ar'?'الحين':'now';if(m<60)return(myLang()==='ar'?'قبل ':'')+m+(myLang()==='ar'?' دقيقة':' min ago');const h=Math.floor(m/60);return(myLang()==='ar'?'قبل ':'')+h+(myLang()==='ar'?' ساعة':' h ago')}
function renderFamily(){
  $('famPushLink').href='https://ntfy.sh/'+famTopic+'-alert';
  if(!famData.length){$('famLast').textContent=t('fam_none');$('famMap').innerHTML='';$('famWarn').innerHTML='';$('famHist').innerHTML='';return}
  const L=famData[0];const kindIc={loc:'📍',fine:'👋',sos:'🆘',taxi:'🚕'}[L.k]||'📍';
  $('famLast').innerHTML=`${kindIc} <b>${esc(L.name||'')}</b> — ${esc(L.area||'')}<br><span class="small">${esc(ago(L.ts))} · ${new Date(L.ts).toLocaleString()}${L.acc?` · ±${L.acc}m`:''}</span><br><a href="https://maps.google.com/?q=${L.lat},${L.lng}" target="_blank" rel="noopener">🗺️ ${esc(t('open_maps'))}</a>`;
  const d=0.006;$('famMap').innerHTML=`<iframe style="width:100%;height:260px;border:0;border-radius:18px;margin:6px 0" loading="lazy" src="https://www.openstreetmap.org/export/embed.html?bbox=${L.lng-d}%2C${L.lat-d}%2C${L.lng+d}%2C${L.lat+d}&layer=mapnik&marker=${L.lat}%2C${L.lng}"></iframe>`;
  const W=[];const ageH=(Date.now()-L.ts)/3600e3;
  if(famData.some(x=>x.k==='sos'&&Date.now()-x.ts<12*3600e3))W.push(['red',t('fam_w_sos')]);
  if(ageH>3)W.push(['',t('fam_w_stale',{h:Math.floor(ageH)})]);
  if(L.acc&&L.acc>200)W.push(['',t('fam_w_acc')]);
  if(L.hotel){const dk=hav(L,L.hotel);const hr=new Date(L.ts).getHours();if(dk>5&&(hr>=22||hr<5))W.push(['red',t('fam_w_night',{km:dk.toFixed(1)})]);else if(dk>25)W.push(['',t('fam_w_far',{km:dk.toFixed(0)})])}
  $('famWarn').innerHTML=W.map(([c,x])=>`<div class="${c==='red'?'err':'glass info'}">⚠️ ${esc(x)}</div>`).join('')||`<div class="glass info">✅ ${esc(t('fam_ok'))}</div>`;
  $('famHist').innerHTML=famData.slice(0,15).map(x=>`<div class="glass info small" style="font-weight:600">${({loc:'📍',fine:'👋',sos:'🆘',taxi:'🚕'}[x.k]||'📍')} ${esc(x.area||'')} · ${esc(ago(x.ts))} · <a href="https://maps.google.com/?q=${x.lat},${x.lng}" target="_blank" rel="noopener">🗺️</a></div>`).join('');
}
async function famSafety(){
  if(!famData.length)return;if(!hasAI()){showAlert('🔑',t('need_key'));return}
  const L=famData[0];$('famSafetyOut').innerHTML=`<div class="glass info">⏳</div>`;
  try{const a=await chat([{role:'system',content:`You give brief, factual, non-stigmatizing travel-safety notes for a family member of an elderly Saudi tourist. Location: "${L.area}" (${L.lat},${L.lng}), country ${L.cc}, local time of last update ${new Date(L.ts).toLocaleTimeString()}. Mention only well-known, general facts: whether it is a busy tourist/nightlife area, common tourist scams nearby, traffic, flooding, late-night caution, and nearest kinds of help (tourist police number). If you are not sure about this specific area, say so and give general advice. Never label residents or ethnic groups. Answer in ${myLangName()} in 3-5 short bullet-like sentences.`}],{temp:.3});
    $('famSafetyOut').innerHTML=`<div class="bubble ai">${esc(a)}</div><p class="small">${esc(t('fam_safety_note'))}</p>`}catch(e){$('famSafetyOut').innerHTML=`<div class="err">${esc(e.message)}</div>`}
}
function openFamilyFromHash(){const m=location.hash.match(/^#family-([a-z0-9-]{8,})$/);if(!m)return false;famTopic=m[1];$('splash').classList.remove('on');$('onb').classList.remove('on');go('family');famRefresh();clearInterval(famTimer);famTimer=setInterval(()=>{if(cur==='family')famRefresh()},60000);return true}

/* ================= SETTINGS TRANSFER ================= */
function b64e(s){return btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function b64d(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return decodeURIComponent(escape(atob(s)))}
function exportSettings(){
  const c=JSON.parse(JSON.stringify(cfg));if(!$('sExpKey').checked)delete c.key;delete c.onboarded;
  const code=b64e(JSON.stringify({c,m:meds}));const u=location.origin+location.pathname+'#import-'+code;
  $('expOut').innerHTML=`<div class="glass info small" style="direction:ltr;word-break:break-all;max-height:120px;overflow:auto">${esc(code)}</div><button class="big alt" id="expCopy">📋 ${esc(t('copy'))}</button><a class="big alt" style="display:block;text-align:center;text-decoration:none" href="https://wa.me/?text=${encodeURIComponent(u)}" target="_blank" rel="noopener">💬 ${esc(t('s_send_link'))}</a>`;
  $('expCopy').onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(code).catch(()=>{})};
}
function importSettings(code){
  try{code=(code||'').trim().replace(/^.*#import-/,'');const j=JSON.parse(b64d(code));
    const keep=cfg.key;cfg=Object.assign(cfg,j.c||{});if(!cfg.key)cfg.key=keep;cfg.onboarded=true;saveCfg();if(j.m){meds=j.m;S.set('meds',meds)}
    showAlert('✅',t('s_imported'));renderAll();if(cur==='settings')fillSettings();return true}
  catch(e){showAlert('⚠️',t('s_import_bad'));return false}
}

function setTalk(on){document.querySelectorAll('.char').forEach(e=>e.classList.toggle('talk',!!on))}
function charHtml(h){return `<div class="char" style="height:${h}px;width:${Math.round(h*0.56)}px"><img src="${CHAR_IMG}" style="height:${h}px;width:auto" alt="Bin3abdAi"></div>`}

/* ================= TRIP TYPE & BUDGET ================= */
const TRIP_TYPES={work:['💼','tt_work','tt_work_s'],tour:['🏖️','tt_tour','tt_tour_s'],med:['🏥','tt_med','tt_med_s'],res:['🏠','tt_res','tt_res_s']};
const SPLITS={work:[['b_stay',40],['b_move',20],['b_food',20],['b_emerg',10],['b_misc',10]],tour:[['b_stay',35],['b_food',20],['b_fun',20],['b_shop',15],['b_emerg',10]],med:[['b_treat',50],['b_stay',25],['b_food',10],['b_move',10],['b_emerg',5]],res:[['b_rent',40],['b_food',25],['b_move',15],['b_bills',10],['b_save',10]]};
function tripCtx(){const tt=cfg.tripType;if(!tt)return'';const b=cfg.budget||{};const names={work:'business trip (be cost-efficient)',tour:'tourism',med:'medical treatment trip (prioritize clinics, rest, accessibility)',res:'resident living there'};
  return ` Trip type: ${names[tt]}.`+(b.amount?` Budget: ${b.amount} ${b.cur} for ${b.days||'?'} days (${tt==='res'?'monthly':'whole trip'}), split: ${(SPLITS[tt]||[]).map(([k,v])=>T.en[k]+' '+v+'%').join(', ')}. Keep suggestions within budget.`:'')}
function splitHtml(){const tt=cfg.tripType,b=cfg.budget||{};if(!tt||!b.amount)return'';const per=b.days?Math.round(b.amount/b.days):null;
  return `<div class="glass info"><b>💰 ${esc(t('b_title'))}: ${fmt(b.amount)} ${esc(curName(b.cur))}</b>${per&&tt!=='res'?` <span class="small">(${fmt(per)} ${esc(t('b_perday'))})</span>`:''}<div class="split">${SPLITS[tt].map(([k,v])=>`<div class="rowb"><span>${esc(t(k))}</span><div class="bar"><i style="width:${v}%"></i></div><b>${fmt(Math.round(b.amount*v/100))}</b></div>`).join('')}</div></div>`}

/* ================= NEW CONVERSATIONAL ONBOARDING ================= */
let ob={step:0,said:{}};
const OB_STEPS=['hello','lang','name','type','dest','budget','family','done'];
function obStart(){ob={step:0,said:{}};$('onb').classList.remove('on');$('ob').classList.add('on');obRender()}
function obSay(text,why){const k=ob.step+'|'+myLang();if(ob.said[k]||!booted&&ob.step===0)return;ob.said[k]=true;speak(text+(why?(' '+why):''),myLang(),true,true)}
function obNext(n){ob.step=n!=null?n:ob.step+1;if(OB_STEPS[ob.step]==='budget'&&cfg.tripType==='res'&&!ob.resBudget){}obRender()}
function obShell(q,why,body){const n=OB_STEPS.length-2;
  $('ob').innerHTML=`<div class="obTop">${charHtml(210)}<div class="bub"><div class="who">Bin3abdAi</div>${esc(q)}${why?`<span class="why">💡 ${esc(why)}</span>`:''}</div></div>
  <div class="obBody">${ob.step>0&&ob.step<OB_STEPS.length-1?`<div class="prog">${[...Array(n)].map((_,i)=>`<i class="${i<ob.step?'on':''}"></i>`).join('')}</div>`:''}${body}</div>`;
  obSay(q,why)}
function obMicBtn(label){return `<button class="obMic" id="obMic" onclick="obMicTap()">🎙️ ${esc(label||t('ob_say'))}</button>`}
function obRender(){
  const st=OB_STEPS[ob.step],c=country();
  if(st==='hello'){obShell(t('ob_hello'),'',`<button class="obMic" style="padding:22px;font-size:1.25em" onclick="booted=true;try{getCtx()}catch(e){};obNext(1)">👆 ${esc(t('ob_tap_start'))}</button><p class="small" style="text-align:center">${esc(t('ob_tap_why'))}</p>`);return}
  if(st==='lang'){const L=langOf(myLang());obShell(t('ob_lang_q'),t('ob_lang_why'),`
    ${obMicBtn(t('ob_lang_speak'))}
    <button class="obLangBtn" onclick="pickUiLang();obWaitPicker()"><span class="g">🌐</span><span class="t">${esc(L?langName(L):myLang())}<small>${esc(t('ob_lang_search'))}</small></span><span>›</span></button>
    <div class="row"><button class="pill ${myLang()==='ar'?'sel':''}" onclick="obLang('ar')">العربية</button><button class="pill ${myLang()==='en'?'sel':''}" onclick="obLang('en')">English</button><button class="pill" onclick="obLang('th')">ไทย</button></div>
    <button class="big" onclick="obNext()">${esc(t('next_btn'))}</button>`);return}
  if(st==='name'){obShell(t('ob_name_q'),t('ob_name_why'),`${obMicBtn()}<input id="obName" style="font-size:1.2em" placeholder="${esc(t('onb_name_ph'))}" value="${esc(cfg.name)}"><button class="big" onclick="cfg.name=$('obName').value.trim();saveCfg();obNext()">${esc(t('next_btn'))}</button>`);return}
  if(st==='type'){obShell(t('ob_type_q'),t('ob_type_why'),`<div class="obGrid">${Object.entries(TRIP_TYPES).map(([k,[e,l,sm]])=>`<button class="obCard ${cfg.tripType===k?'sel':''}" onclick="obType('${k}')"><span class="e">${e}</span>${esc(t(l))}<small>${esc(t(sm))}</small></button>`).join('')}</div>${obMicBtn()}`);return}
  if(st==='dest'){const q=cfg.tripType==='res'?t('ob_dest_q_res'):t('ob_dest_q');obShell(q,t('ob_dest_why'),`
    <button class="obLangBtn" onclick="pickCountry(()=>obRender())"><span class="g">${c?flag(c[0]):'🌍'}</span><span class="t">${c?esc(myLang()==='ar'?c[1]:c[2]):esc(t('choose_country'))}<small>${esc(t('ob_dest_search'))}</small></span><span>›</span></button>
    <button class="big alt" onclick="obAutoCountry()">📍 ${esc(t('ob_dest_auto'))}</button>${obMicBtn()}
    <button class="big" ${c?'':'disabled style="opacity:.5"'} onclick="obNext()">${esc(t('next_btn'))}</button>`);return}
  if(st==='budget'){const b=cfg.budget||{cur:cfg.homeCur||'SAR'};const res=cfg.tripType==='res';obShell(res?t('ob_budget_q_res'):t('ob_budget_q'),t('ob_budget_why_'+(cfg.tripType||'tour')),`
    ${obMicBtn()}
    <div class="row"><div style="flex:2"><div class="small">${esc(t('ob_amount'))}</div><input id="obAmt" inputmode="numeric" style="font-size:1.3em;direction:ltr" value="${b.amount||''}" oninput="obBudgetLive()"></div><div><div class="small">${esc(t('ob_cur'))}</div><select id="obCur" onchange="obBudgetLive()">${[cfg.homeCur||'SAR',c?c[3]:'USD','USD'].filter((x,i,a)=>a.indexOf(x)===i).map(x=>`<option ${b.cur===x?'selected':''}>${x}</option>`).join('')}</select></div>${res?'':`<div><div class="small">${esc(t('ob_days'))}</div><input id="obDays" inputmode="numeric" style="direction:ltr" value="${b.days||7}" oninput="obBudgetLive()"></div>`}</div>
    <div id="obSplit">${splitHtml()}</div>
    <button class="big" onclick="obBudgetSave();obNext()">${esc(t('next_btn'))}</button><button class="big alt" onclick="obNext()">${esc(t('later'))}</button>`);return}

const PNAMES=[['Fajr','الفجر','Fajr'],['Sunrise','الشروق','Sunrise'],['Dhuhr','الظهر','Dhuhr'],['Asr','العصر','Asr'],['Maghrib','المغرب','Maghrib'],['Isha','العشاء','Isha']];

function dayKey(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fmt12(hhmm){let[h,m]=hhmm.split(':').map(Number);const s=myLang()==='ar'?(h<12?'ص':'م'):(h<12?'AM':'PM');h=h%12||12;return h+':'+String(m).padStart(2,'0')+' '+s}
function getPos(precise){return new Promise(res=>{
  if(!navigator.geolocation)return res(null);
  let best=null,done=false,w=null;
  const finish=()=>{if(done)return;done=true;try{navigator.geolocation.clearWatch(w)}catch(e){}if(best){lastPos=best;S.set('pos',best);updateArea(best)}res(best||lastPos||null)};
  w=navigator.geolocation.watchPosition(p=>{const v={lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy),ts:Date.now()};if(!best||v.acc<best.acc)best=v;if(v.acc<=(precise?20:60))finish()},()=>finish(),{enableHighAccuracy:true,maximumAge:precise?0:60000,timeout:15000});
  setTimeout(finish,precise?9000:5000);
})}
let area=S.get('area',null);
async function updateArea(p){
  if(area&&area.lat&&hav(area,p)<0.15){renderLoc();return}
  try{const j=await(await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${p.lat}&longitude=${p.lng}&localityLanguage=${myLang()==='ar'?'ar':'en'}`)).json();
    const parts=[j.locality,j.city||j.principalSubdivision].filter(Boolean);
    area={lat:p.lat,lng:p.lng,name:[...new Set(parts)].join('، '),country:j.countryName||'',cc:j.countryCode||''};S.set('area',area);
  }catch(e){}
  renderLoc();
}

function methodFor(){if(cfg.method!=='auto')return cfg.method;const c=country();if(!c)return'3';return({SA:'4',EG:'5',TR:'13',US:'2',CA:'2',AE:'16',QA:'10',KW:'9',MY:'17',SG:'11',ID:'20',JO:'23',MA:'21',TN:'18'})[c[0]]||'3'}
async function loadPrayer(force){
  if(!force&&prayer&&prayer.day===dayKey()){renderPrayer();renderHome();return}
  const pos=await getPos();const d=new Date(),ds=String(d.getDate()).padStart(2,'0')+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+d.getFullYear();
  const c=country();
  const url=pos?`https://api.aladhan.com/v1/timings/${ds}?latitude=${pos.lat}&longitude=${pos.lng}&method=${methodFor()}`
    :`https://api.aladhan.com/v1/timingsByCity/${ds}?city=${encodeURIComponent(c?c[2]:'Jeddah')}&country=${encodeURIComponent(c?c[0]:'SA')}&method=${methodFor()}`;
  try{const r=await fetch(url);const j=await r.json();const tm=j.data.timings,h=j.data.date.hijri;const timings={};PNAMES.forEach(([k])=>timings[k]=String(tm[k]).slice(0,5));
    prayer={pos:pos?{lat:pos.lat,lng:pos.lng}:null,day:dayKey(),timings,hijri:`${h.day} ${h.month.ar} ${h.year}هـ`,hijriEn:`${h.day} ${h.month.en} ${h.year} AH`};S.set('prayer',prayer)}
  catch(e){if(!prayer){$('homePrayer').textContent='🕌 '+t('prayer_fail');return}}
  renderPrayer();renderHome();
}

  for(const p of PNAMES){if(p[0]==='Sunrise')continue;const[h,m]=prayer.timings[p[0]].split(':').map(Number);if(h*60+m>mins)return{p,t:prayer.timings[p[0]],left:h*60+m-mins}}
  const[h,m]=prayer.timings.Fajr.split(':').map(Number);return{p:PNAMES[0],t:prayer.timings.Fajr,left:24*60-mins+h*60+m}}

function renderAz(){const d=AZ[azSet][azI];$('azProg').textContent=`${azI+1} / ${AZ[azSet].length}`;$('azText').textContent=d.t;$('azCount').textContent=azC>=d.n?t('done'):`${azC} / ${d.n}`}
function azTap(){const d=AZ[azSet][azI];azC++;try{navigator.vibrate&&navigator.vibrate(30)}catch(e){}
  if(azC>=d.n){renderAz();setTimeout(()=>{if(azI<AZ[azSet].length-1){azI++;azC=0;renderAz()}else{$('azCount').textContent=t('az_done');logDone('athkar_'+azSet,'');askRate('athkar',azSet,{voice:true})}},600)}else renderAz()}
function azMove(d){azI=Math.min(AZ[azSet].length-1,Math.max(0,azI+d));azC=0;renderAz()}

/* ================= MEDS ================= */
let taken=S.get('taken',{});
function todayDoses(){const o=[];meds.forEach((m,i)=>(m.times||[]).forEach(tt=>o.push({i,t:tt,key:i+'_'+tt,name:m.name,note:m.note})));return o.sort((a,b)=>a.t.localeCompare(b.t))}
const isTaken=k=>!!(taken[dayKey()]||{})[k];
function markTaken(k){const md=todayDoses().find(x=>x.key===k);logDone('med',md?md.name:'');const d=dayKey();taken[d]=taken[d]||{};taken[d][k]=true;Object.keys(taken).forEach(x=>{if(x<dayKey(new Date(Date.now()-7*864e5)))delete taken[x]});S.set('taken',taken);renderMeds();renderHome()}
function renderMeds(){const L=todayDoses();if(!L.length){$('medList').innerHTML=`<div class="glass info">${esc(t('meds_none'))}</div>`;return}
  $('medList').innerHTML=L.map(d=>{const done=isTaken(d.key);return`<div class="glass med ${done?'done':''}"><div class="n">💊 ${esc(d.name)}</div><div>⏰ ${fmt12(d.t)} ${d.note?(' — '+esc(d.note)):''}</div>${done?`<div style="font-weight:800;color:var(--ok)">${esc(t('taken_lbl'))}</div>`:`<button class="big green" onclick="markTaken('${d.key}')">${esc(t('taken'))}</button>`}</div>`}).join('')}
function nextDose(){const n=new Date(),c=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');return todayDoses().find(d=>!isTaken(d.key)&&d.t>=c)||todayDoses().find(d=>!isTaken(d.key))}

/* ================= ALERTS / TICK ================= */
let aQ=[],aOpen=false;
function showAlert(ic,msg,o={}){aQ.push({ic,msg,o});if(!aOpen)nextAlert()}
function closeAlert(){aQ=[];aOpen=false;$('alertBox').classList.remove('on')}
function nextAlert(){const a=aQ.shift();if(!a){aOpen=false;$('alertBox').classList.remove('on');return}
  aOpen=true;$('alIc').textContent=a.ic;$('alMsg').textContent=a.msg;
  $('alOk').style.display=a.o.noBtn?'none':'block';$('alOk').textContent=a.o.okText||t('ok');$('alOk').onclick=()=>{a.o.onOk&&a.o.onOk();nextAlert()};
  $('alLater').style.display=a.o.onLater?'block':'none';$('alLater').textContent=t('remind_later');$('alLater').onclick=()=>{a.o.onLater();nextAlert()};
  $('alertBox').classList.add('on');if(a.o.say)speak(a.o.say,myLang())}
function beep(){try{const c=getCtx();const o=c.createOscillator(),g=c.createGain();o.frequency.value=880;o.connect(g);g.connect(c.destination);g.gain.value=.25;o.start();setTimeout(()=>o.frequency.value=660,300);setTimeout(()=>o.stop(),700)}catch(e){}}
let fired=S.get('fired',{}),snoozed={};
function tick(){
  const n=new Date(),hm=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0'),day=dayKey();
  if(fired.day!==day)fired={day};
  todayDoses().forEach(d=>{const fk='m_'+d.key,due=(d.t===hm&&!fired[fk])||(snoozed[d.key]&&Date.now()>=snoozed[d.key]);
    if(due&&!isTaken(d.key)){fired[fk]=true;delete snoozed[d.key];beep();sysNotify('💊',t('med_time')+': '+d.name);
      showAlert('💊',t('med_time')+': '+d.name+(d.note?' — '+d.note:''),{okText:t('taken'),say:t('med_time')+' '+d.name,onOk:()=>markTaken(d.key),onLater:()=>{snoozed[d.key]=Date.now()+15*60000}})}});
  if(prayer&&prayer.day===day){PNAMES.forEach(p=>{if(p[0]==='Sunrise')return;const fk='p_'+p[0];if(prayer.timings[p[0]]===hm&&!fired[fk]){fired[fk]=true;beep();sysNotify('🕌 '+pName(p),t('prayer_now')+' '+pName(p));showAlert('🕌',t('prayer_now')+' '+pName(p),{say:t('prayer_now')+' '+pName(p),okText:t('prayed_btn'),onOk:()=>markPrayed(p[0]),onLater:()=>{}})}})}
  else loadPrayer(false);
  if(prayer&&prayer.day===day&&cfg.preAdhan!==false){PNAMES.forEach(p=>{if(p[0]==='Sunrise')return;const[h,m]=prayer.timings[p[0]].split(':').map(Number);const tm=h*60+m-5;const pre=String(Math.floor((tm+1440)%1440/60)).padStart(2,'0')+':'+String((tm+1440)%60).padStart(2,'0');const fk='pre_'+p[0];if(pre===hm&&!fired[fk]){fired[fk]=true;beep();sysNotify('⏰',t('pre_adhan',{p:pName(p)}));showAlert('⏰',t('pre_adhan',{p:pName(p)}),{say:t('pre_adhan',{p:pName(p)})})}})}
  const dt=dhikrTimes(),di=dt.indexOf(hm);if(di>=0&&!fired['dh_'+hm]){fired['dh_'+hm]=true;const dz=DHIKR_SHORT[di%DHIKR_SHORT.length];tick2(880,120);sysNotify('📿',dz);showAlert('📿',dz,{say:dz,okText:t('said_it'),onOk:()=>logDone('dhikr',dz,{silent:true})})}
  planTick(hm,fired);dailyReview(hm,fired);
  locHeartbeat();
  S.set('fired',fired);if(cur==='home')renderHome();
}

/* ================= HOME ================= */
function renderHome(){
  const n=new Date();
  $('hello').textContent=(n.getHours()<12?t('gm'):t('ge'))+(cfg.name?(myLang()==='ar'?' يا ':', ')+cfg.name:'')+' 👋';
  if($('clock'))$('clock').textContent=fmt12(String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0'));
  let dt='';try{dt=n.toLocaleDateString(myLang()==='ar'?'ar-SA-u-nu-latn-ca-gregory':myLang(),{weekday:'long',day:'numeric',month:'long'})}catch(e){}
  if($('today'))$('today').textContent=dt+(prayer&&prayer.day===dayKey()?(' — '+(myLang()==='ar'?prayer.hijri:prayer.hijriEn)):'');
  const c=country();$('destChip').textContent=c?(flag(c[0])+' '+(myLang()==='ar'?c[1]:c[2])):('🌍 '+t('choose_country'));
  const np=nextPrayer();if(np)$('homePrayer').innerHTML=`🕌 ${esc(t('next_prayer'))}: <b>${esc(pName(np.p))}</b> ${esc(t('at'))} ${fmt12(np.t)}<br><span class="small">${esc(t('left'))} ${esc(leftText(np.left))}</span>`;
  const d=nextDose();
  if(!hasAI()){$('homeMed').style.display='block';$('homeMed').innerHTML='🔑 '+esc(t('need_key'))}
  else if(d){$('homeMed').style.display='block';$('homeMed').innerHTML=`💊 ${esc(t('next_med'))}: <b>${esc(d.name)}</b> ${esc(t('at'))} ${fmt12(d.t)}`}
  else $('homeMed').style.display='none';
  renderLoc();renderWx();renderHomePray();
  $('homeAlertsCard').innerHTML=cfg.alertsSet?'':`<div class="glass info" style="text-align:center">🔔 ${esc(t('alerts_card'))}<button class="big green" onclick="enableAlerts()">${esc(t('alerts_btn'))}</button></div>`;
}

/* ================= SETTINGS ================= */
function fillSettings(){$('sQuota').innerHTML=quotaHtml();
  const L=langOf(myLang());$('sUiLang').textContent=flag(L&&L[3])+' '+(L?(L[0]==='ar'?'العربية':L[2]):myLang());
  const c=country();$('sDest').textContent=c?(flag(c[0])+' '+(myLang()==='ar'?c[1]:c[2])):t('choose_country');
  $('sKey').value=cfg.key;$('sName').value=cfg.name;$('sAbout').value=cfg.about;$('sVoice').value=cfg.voice;$('sReciter').value=cfg.reciter;$('sMethod').value=cfg.method;
  $('sHomeCur').innerHTML=curList().map(x=>`<option>${x}</option>`).join('');$('sHomeCur').value=cfg.homeCur;
  $('sHotelName').value=(cfg.hotel||{}).name||'';$('sHotelAddr').value=(cfg.hotel||{}).addr||'';
  $('famEdit').innerHTML='';(cfg.family||[]).forEach(f=>addFamRow(f));
  $('medEdit').innerHTML='';meds.forEach(m=>addMedRow(m));if(!meds.length)addMedRow();
  $('sDhEvery').value=cfg.dhikrEvery||45;$('sDhFrom').value=cfg.dhikrFrom||'08:00';$('sDhTo').value=cfg.dhikrTo||'22:00';$('sPreAdhan').checked=cfg.preAdhan!==false;$('sShare').checked=!!cfg.shareLoc;$('sRate').checked=!cfg.rateOff;
  $('sMsg').innerHTML='';
}
function addFamRow(f={name:'',phone:''}){const d=document.createElement('div');d.className='famrow';
  d.innerHTML=`<input class="fN" placeholder="${esc(t('fam_name'))}" value="${esc(f.name)}"><input class="fP" style="margin-top:8px;direction:ltr" inputmode="tel" placeholder="${esc(t('fam_phone'))}" value="${esc(f.phone)}"><button class="big alt" style="padding:10px;font-size:.9em" onclick="this.parentNode.remove()">${esc(t('del'))}</button>`;$('famEdit').appendChild(d)}
function addMedRow(m={name:'',times:[],note:''}){const d=document.createElement('div');d.className='medrow';
  d.innerHTML=`<input class="mN" placeholder="${esc(t('med_name'))}" value="${esc(m.name)}"><input class="mT" style="margin-top:8px;direction:ltr" placeholder="08:00, 20:00" value="${esc((m.times||[]).join(', '))}"><input class="mO" style="margin-top:8px" placeholder="${esc(t('med_note'))}" value="${esc(m.note||'')}"><button class="big alt" style="padding:10px;font-size:.9em" onclick="this.parentNode.remove()">${esc(t('del'))}</button>`;$('medEdit').appendChild(d)}
function normTime(s){const m=s.trim().match(/^(\d{1,2})[:.](\d{2})$/);if(!m)return null;const h=+m[1],mi=+m[2];if(h>23||mi>59)return null;return String(h).padStart(2,'0')+':'+String(mi).padStart(2,'0')}
function saveSettings(){
  const oldM=cfg.method;
  cfg.key=$('sKey').value.trim();cfg.name=$('sName').value.trim();cfg.about=$('sAbout').value.trim();cfg.voice=$('sVoice').value;cfg.reciter=$('sReciter').value;cfg.method=$('sMethod').value;
  if(cfg.homeCur!==$('sHomeCur').value){cfg.homeCur=$('sHomeCur').value;rates=null}
  cfg.hotel=Object.assign(cfg.hotel||{},{name:$('sHotelName').value.trim(),addr:$('sHotelAddr').value.trim()});
  cfg.family=[...document.querySelectorAll('.famrow')].map(r=>({name:r.querySelector('.fN').value.trim(),phone:r.querySelector('.fP').value.replace(/[^\d]/g,'')})).filter(f=>f.phone);
  const bad=[];
  meds=[...document.querySelectorAll('.medrow')].map(r=>({name:r.querySelector('.mN').value.trim(),times:r.querySelector('.mT').value.split(/[,،]/).filter(x=>x.trim()).map(x=>{const v=normTime(x);if(!v)bad.push(x.trim());return v}).filter(Boolean),note:r.querySelector('.mO').value.trim()})).filter(m=>m.name&&m.times.length);
  cfg.dhikrEvery=Math.max(15,parseInt($('sDhEvery').value)||45);cfg.dhikrFrom=normTime($('sDhFrom').value)||'08:00';cfg.dhikrTo=normTime($('sDhTo').value)||'22:00';cfg.preAdhan=$('sPreAdhan').checked;cfg.shareLoc=$('sShare').checked;cfg.rateOff=!$('sRate').checked;
  saveCfg();S.set('meds',meds);if(cfg.shareLoc){lastLocSent=0;locHeartbeat()}
  $('sMsg').innerHTML=bad.length?`<div class="err">${esc(t('bad_times'))} ${esc(bad.join(' ، '))}</div>`:`<div class="glass info">${esc(t('saved'))}</div>`;
  if(oldM!==cfg.method)loadPrayer(true);
}
function exportICS(){
  if(!meds.length){$('sMsg').innerHTML=`<div class="err">${esc(t('add_meds_first'))}</div>`;return}
  const d=new Date(),ymd=d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0'),stamp=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
  let ics='BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Khoy Bin3abdAi//AR\r\nCALSCALE:GREGORIAN\r\n';
  meds.forEach((m,i)=>m.times.forEach(tt=>{const hm=tt.replace(':','');ics+=`BEGIN:VEVENT\r\nUID:khoy-${i}-${hm}-${Date.now()}@khoy\r\nDTSTAMP:${stamp}\r\nDTSTART:${ymd}T${hm}00\r\nDURATION:PT10M\r\nRRULE:FREQ=DAILY\r\nSUMMARY:💊 ${m.name}${m.note?(' - '+m.note):''}\r\nBEGIN:VALARM\r\nACTION:DISPLAY\r\nDESCRIPTION:${m.name}\r\nTRIGGER:PT0M\r\nEND:VALARM\r\nEND:VEVENT\r\n`}));
  ics+='END:VCALENDAR\r\n';const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([ics],{type:'text/calendar;charset=utf-8'}));a.download='meds.ics';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);
}

/* ================= ONBOARDING ================= */
let onbStep=0;
function startOnboarding(){obStart()}
function onbDots(){return`<div class="dots">${[0,1,2,3,4].map(i=>`<i class="${i===onbStep?'on':''}"></i>`).join('')}</div>`}
function renderOnb(){
  const o=$('onb');const c=country();
  if(onbStep===0){o.innerHTML=`${onbDots()}<div style="text-align:center"><div class="orbmini" style="width:110px;height:110px;margin:0 auto;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,rgba(var(--accentRGB),.9) 30%,var(--accent2) 70%,transparent 72%);box-shadow:0 0 40px rgba(var(--accentRGB),.6);animation:breathe 3s ease-in-out infinite"></div>
    <h1>${esc(t('onb_hi'))}</h1><p class="small" style="font-size:1em">${esc(t('onb_hi2'))}</p><h3>${esc(t('onb_lang'))}</h3></div>
    <div class="row"><button class="pill ${myLang()==='ar'?'sel':''}" onclick="onbLang('ar')">🇸🇦 العربية</button><button class="pill ${myLang()==='en'?'sel':''}" onclick="onbLang('en')">🇬🇧 English</button></div>
    <button class="big alt" onclick="pickUiLang();onbAfterPick()">${esc(t('more_langs'))}</button>
    <button class="big" onclick="onbStep=1;renderOnb()">${esc(t('next_btn'))}</button>`}
  else if(onbStep===1){o.innerHTML=`${onbDots()}<h1>${esc(t('onb_name'))}</h1><input id="onbName" style="font-size:1.2em" placeholder="${esc(t('onb_name_ph'))}" value="${esc(cfg.name)}"><button class="big" onclick="cfg.name=$('onbName').value.trim();saveCfg();onbStep=2;renderOnb()">${esc(t('next_btn'))}</button>`}
  else if(onbStep===2){o.innerHTML=`${onbDots()}<h1>${esc(t('onb_dest'))}</h1><button class="pill sel" style="font-size:1.2em" onclick="pickCountry(renderOnb)">${c?(flag(c[0])+' '+esc(myLang()==='ar'?c[1]:c[2])):'🌍 '+esc(t('choose_country'))}</button><button class="big" onclick="onbStep=3;renderOnb()">${esc(t('next_btn'))}</button>`}
  else if(onbStep===3){const f=(cfg.family||[])[0]||{name:'',phone:''};o.innerHTML=`${onbDots()}<h1>👨‍👩‍👦 ${esc(t('onb_fam'))}</h1><p class="small" style="font-size:1em">${esc(t('onb_fam_help'))}</p>
    <input id="onbFamName" placeholder="${esc(t('onb_fam_name'))}" value="${esc(f.name)}"><input id="onbFamPhone" inputmode="tel" style="direction:ltr" placeholder="+9665xxxxxxxx" value="${esc(f.phone)}">
    <label style="display:flex;gap:8px;align-items:center;margin:10px 0"><input type="checkbox" id="onbShare" style="width:auto" checked> <span>${esc(t('onb_fam_ok'))}</span></label>
    <button class="big green" onclick="onbFamSave(true)">💬 ${esc(t('onb_fam_send'))}</button><button class="big alt" onclick="onbStep=4;renderOnb()">${esc(t('later'))}</button>`}
  else{if(KHOY_PROXY&&!cfg.key){finishOnb();return}o.innerHTML=`${onbDots()}<h1>${esc(t('onb_key'))}</h1><p class="small" style="font-size:.95em">${esc(t('onb_key_help'))}</p><input id="onbKey" type="password" placeholder="sk-..." value="${esc(cfg.key)}"><a class="small" href="https://platform.openai.com/api-keys" target="_blank" rel="noopener">platform.openai.com/api-keys</a>
    <button class="big green" onclick="cfg.key=$('onbKey').value.trim();finishOnb()">${esc(t('start'))}</button><button class="big alt" onclick="finishOnb()">${esc(t('later'))}</button>`}
}
async function onbLang(code){await setUiLang(code);renderOnb()}
function onbAfterPick(){const iv=setInterval(()=>{if(!$('picker').classList.contains('on')){clearInterval(iv);renderOnb()}},400)}

function onbFamSave(send){const n=$('onbFamName').value.trim(),ph=$('onbFamPhone').value.replace(/[^\d+]/g,'');
  if(ph){cfg.family=[{name:n||t('family_word'),phone:ph}].concat((cfg.family||[]).slice(1))}
  cfg.shareLoc=$('onbShare').checked;saveCfg();
  if(send&&ph)openUrl('https://wa.me/'+ph.replace(/\D/g,'')+'?text='+encodeURIComponent(famInviteText()));
  onbStep=4;renderOnb()}
function famInviteText(){return (myLang()==='ar'?`السلام عليكم، هذا رابط تطمّن فيه علي وتشوف آخر مكان لي في رحلتي (${cfg.name||''}) عن طريق تطبيق خوي:\n`:`Hi, follow my trip location safely with the Khoy app:\n`)+familyLink()}
function famQuick(){
  const go2=()=>{const f=(cfg.family||[])[0];openUrl((f&&f.phone)?('https://wa.me/'+f.phone.replace(/\D/g,'')+'?text='+encodeURIComponent(famInviteText())):('https://wa.me/?text='+encodeURIComponent(famInviteText())))};
  if(cfg.shareLoc){go2();return}
  showAlert('👨‍👩‍👦',t('fam_quick_ask'),{okText:t('fam_quick_ok'),onOk:()=>{cfg.shareLoc=true;saveCfg();lastLocSent=0;locHeartbeat();renderLoc();go2()},onLater:()=>{}})}
function finishOnb(){cfg.onboarded=true;saveCfg();$('onb').classList.remove('on');renderAll();loadPrayer(true);startApp()}
